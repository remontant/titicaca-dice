/* 레이아웃 : 화면 가운데 세로로 긴 게임 한 장(9:17). 폰에서는 화면을 꽉 채우고, 넓은 화면에서는 숲 바탕 위에 놓인다.
   게임 안은 calc(var(--u)*1) = 게임 폭의 1%, 세로는 calc(var(--u)*188.9). 숲 세계는 한 장으로 단마다 아래로 내려간다. */
:root{
  --shell:#0F2A22; --shell-hi:#1E4A36; --ink:#3B2F4A; --wood:#6E4122; --wood-dk:#5E3418; --leaf:#4FA83A; --leaf-dk:#2F7A26;

  --display:"Do Hyeon","Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --logo:"Jua","Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box;background:var(--shell)}

.shell{height:100%;container-type:size;display:grid;place-items:center}
.game{position:relative;width:100%;height:100%;--u:min(1cqw,100cqh / 188.9);overflow:hidden;isolation:isolate;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;font-family:var(--logo);color:#fff;background:#A6E2FA;box-shadow:0 0 60px rgba(0,0,0,.4)}
.game canvas{position:absolute;left:0;display:block;pointer-events:none}
.world{top:0;transition:transform 1.5s cubic-bezier(.45,.05,.25,1);will-change:transform}
.water{z-index:5}
.pad{position:absolute;z-index:2;cursor:pointer}
.pad svg{display:block;width:100%;height:100%;overflow:visible}
.game[data-state="title"] .pad,.game[data-state="watch"] .pad,.game[data-state="over"] .pad{cursor:default}
.crowd{position:absolute;inset:0;z-index:3;pointer-events:none}

.sl svg{display:block;width:100%;height:100%;overflow:visible}
.me-tag{position:absolute;left:50%;bottom:96%;translate:-50% 0;font-family:var(--logo);font-size:max(12px,calc(var(--u)*3.8));line-height:1;color:#fff;background:var(--me);border:calc(var(--u)*.55) solid #fff;border-radius:calc(var(--u)*3);padding:calc(var(--u)*.7) calc(var(--u)*1.7) calc(var(--u)*.5);box-shadow:0 calc(var(--u)*.6) 0 rgba(60,20,40,.25);white-space:nowrap;animation:tagbob 1.1s ease-in-out infinite}

.card{position:absolute;z-index:8;left:50%;width:min(calc(100% - calc(var(--u)*10)),calc(var(--u)*150*var(--fs,1)));translate:-50% 0;top:calc(var(--u)*14);padding:calc(var(--u)*3.4) calc(var(--u)*4) calc(var(--u)*3.6);display:flex;flex-direction:column;gap:calc(var(--u)*2.4);color:#4A2810;border-radius:calc(var(--u)*4.4);border:calc(var(--u)*.9) solid var(--wood);background:radial-gradient(circle at calc(var(--u)*3.2) calc(var(--u)*3.2),var(--wood-dk) calc(var(--u)*.9),transparent calc(var(--u)*1.1)),radial-gradient(circle at calc(100% - calc(var(--u)*3.2)) calc(var(--u)*3.2),var(--wood-dk) calc(var(--u)*.9),transparent calc(var(--u)*1.1)),repeating-linear-gradient(176deg,rgba(122,74,34,.13) 0 calc(var(--u)*.45),transparent calc(var(--u)*.45) calc(var(--u)*3.1)),linear-gradient(#F7D59E,#E2AA6A);box-shadow:0 calc(var(--u)*1.3) 0 var(--wood-dk),0 calc(var(--u)*3) calc(var(--u)*5) rgba(30,60,20,.28)}
.card::before,.card::after,.sign::before,.sign::after{content:"";position:absolute;top:calc(var(--u)*-16);width:calc(var(--u)*1.3);height:calc(var(--u)*16.6);border-radius:calc(var(--u)*.7);background:linear-gradient(90deg,#2F7A26,#5DBE4E 50%,#2F7A26);z-index:-1}
.card::before,.sign::before{left:14%}

.c-row{display:flex;align-items:center;gap:calc(var(--u)*2)}
.tag{font-size:max(14px,calc(var(--u)*4.1*var(--fs,1)));line-height:1;padding:calc(var(--u)*1.2) calc(var(--u)*2.6) calc(var(--u)*1);color:#fff;background:var(--leaf);border-radius:calc(var(--u)*3.4) calc(var(--u)*.6) calc(var(--u)*3.4) calc(var(--u)*.6);box-shadow:0 calc(var(--u)*.5) 0 var(--leaf-dk)}

.startbtn,.cta{display:grid;place-items:center;border-radius:calc(var(--u)*6.5);background:linear-gradient(#FFE07A,#FFB428);box-shadow:0 calc(var(--u)*1.6) 0 #C9790C,inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.55),0 calc(var(--u)*2.4) calc(var(--u)*3) rgba(0,0,0,.25);text-shadow:0 calc(var(--u)*.5) 0 rgba(150,80,0,.45)}
.startbtn{position:absolute;z-index:8;left:50%;translate:-50% 0;width:calc(var(--u)*76);bottom:calc(var(--u)*4.6);height:calc(var(--u)*17);font-size:calc(var(--u)*8);animation:breathe 1.6s ease-in-out infinite}
.startbtn:active,.cta:active{transform:translateY(calc(var(--u)*1.2));box-shadow:0 calc(var(--u)*.4) 0 #C9790C,inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.55)}
.cta.sub{background:linear-gradient(#9BE36E,#4FA83A);box-shadow:0 calc(var(--u)*1.6) 0 var(--leaf-dk),inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.45);text-shadow:0 calc(var(--u)*.5) 0 rgba(20,80,20,.4)}
.cta.sub:active{box-shadow:0 calc(var(--u)*.4) 0 var(--leaf-dk),inset 0 calc(var(--u)*1) 0 rgba(255,255,255,.45)}
.watchbar{position:absolute;z-index:8;left:50%;translate:-50% 0;width:min(calc(100% - calc(var(--u)*10)),calc(var(--u)*100));bottom:calc(var(--u)*4.6);height:calc(var(--u)*17);display:flex;align-items:center;gap:calc(var(--u)*3);padding:0 calc(var(--u)*3) 0 calc(var(--u)*5);border-radius:calc(var(--u)*6.5);background:rgba(40,60,50,.72);border:calc(var(--u)*.6) solid rgba(255,255,255,.7);font-size:max(16px,calc(var(--u)*4.8*var(--fs,1)))}

/* 처음 화면 */
.sign{position:absolute;z-index:8;left:50%;width:min(calc(100% - calc(var(--u)*12)),calc(var(--u)*112*var(--fs,1)));translate:-50% 0;top:calc(var(--u)*12);padding:calc(var(--u)*5) calc(var(--u)*5) calc(var(--u)*4.6);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*3);border-radius:calc(var(--u)*5);border:calc(var(--u)*.9) solid var(--wood);background:repeating-linear-gradient(176deg,rgba(122,74,34,.12) 0 calc(var(--u)*.45),transparent calc(var(--u)*.45) calc(var(--u)*3.1)),linear-gradient(#F7D59E,#E2AA6A);box-shadow:0 calc(var(--u)*1.4) 0 var(--wood-dk),0 calc(var(--u)*3) calc(var(--u)*5) rgba(30,60,20,.3)}
.logo{margin:0;font-family:var(--logo);font-weight:400;font-size:calc(var(--u)*15.5);line-height:1;letter-spacing:calc(var(--u)*.4);color:#FFE27A;paint-order:stroke fill;-webkit-text-stroke:calc(var(--u)*2.6) var(--wood);text-shadow:0 calc(var(--u)*1.4) 0 var(--wood-dk)}

[3,1,0,"현미경은 멀리 있는 별을 크게 보는 데 쓰는 도구다.","별은 망원경으로 보고, 현미경은 아주 작은 것을 크게 봐요."],
[3,1,1,"자기 부상 열차는 자석의 힘으로 레일 위에 떠서 달린다.","레일과 맞닿지 않고 떠서 달려 덜 흔들리고 소리도 조용해요."],
[3,1,0,"나침반 바늘의 N극은 남쪽을 가리킨다.","N극은 북쪽을 가리키고, N은 북쪽을 뜻하는 영어 낱말의 첫 글자예요."],
[3,1,1,"자동차 타이어에 홈을 파 놓은 것은 미끄러지지 않게 하려는 것이다.","비 오는 날 홈으로 물이 빠져서 바퀴가 길을 꽉 잡아요."],
[3,2,1,"컴퓨터에서 1바이트는 8비트로 이루어진다.","비트는 0이나 1 하나를 담는 가장 작은 단위예요."],
[3,2,1,"CPU는 컴퓨터에서 계산과 명령 처리를 맡는 두뇌 같은 부품이다.","CPU는 '중앙 처리 장치'를 줄인 말이에요."],
[3,2,1,"컴퓨터 전원을 끄면 램(RAM)에 담겨 있던 내용은 사라진다.","그래서 문서는 전원을 꺼도 남는 저장 장치에 저장해야 해요."],
[3,2,0,"다이너마이트를 발명한 사람은 에디슨이다.","다이너마이트는 노벨이 만들었고, 그 재산으로 노벨상이 생겼어요."],
[3,2,1,"에디슨은 소리를 담았다가 다시 들려주는 축음기를 만들었다.","1877년 원통에 감은 얇은 금속박에 소리를 새겨 담았어요."],
[3,2,0,"조선 세종 때 만든 자격루는 해 그림자로 시각을 알려 주는 해시계다.","자격루는 흐르는 물로 시각을 재는 물시계이고, 해시계는 앙부일구예요."],
[3,2,0,"집 벽 콘센트에서 나오는 전기는 건전지와 같은 직류다.","콘센트 전기는 흐르는 방향이 쉴 새 없이 바뀌는 교류예요."],
[3,2,0,"선풍기를 틀면 방 안 공기의 온도가 내려간다.","공기 온도는 그대로이고, 땀을 빨리 말려 시원하게 느껴질 뿐이에요."],
[3,2,1,"컴퓨터 자판의 쿼티(QWERTY) 배열은 옛 타자기 자판에서 이어져 왔다.","자판 윗줄 왼쪽의 여섯 글자를 따서 쿼티라고 불러요."],
[3,2,0,"모스 부호는 소리의 높낮이를 바꿔 가며 글자를 나타낸다.","짧은 신호와 긴 신호를 짜 맞춰 글자를 나타내요."],
[3,3,0,"증기 기관을 처음 발명한 사람은 제임스 와트다.","와트보다 먼저 쓰던 증기 기관이 있었고, 와트는 이를 크게 고쳤어요."],
[3,3,0,"더운 날 냉장고 문을 열어 두면 부엌 전체가 시원해진다.","냉장고는 안의 열을 밖으로 내보내서 방은 오히려 더워져요."],
[3,3,0,"전자레인지는 음식의 한가운데부터 먼저 데운다.","전자파는 겉에서 몇 cm까지만 들어가고, 속은 열이 번져 데워져요."],
[3,3,0,"인터넷과 월드 와이드 웹(WWW)은 같은 말이다.","웹은 인터넷 위에서 돌아가는 여러 서비스 가운데 하나예요."],
[3,3,1,"전압 단위인 볼트(V)는 전지를 만든 볼타의 이름에서 따왔다.","볼타는 1800년에 금속판을 겹겹이 쌓은 전지를 선보였어요."],
[3,3,1,"'로봇'이라는 말은 체코 작가 차페크가 쓴 연극에서 처음 쓰였다.","체코 말로 '고된 일'을 뜻하는 '로보타'에서 따왔어요."],
[3,3,1,"열기구는 비행기보다 먼저 사람을 태우고 하늘을 날았다.","1783년 프랑스 몽골피에 형제가 만든 열기구에 사람이 탔어요."],
[4,1,0,"거미는 개미, 나비와 같은 곤충 무리에 속한다.","거미는 다리가 8개인 거미류예요. 곤충은 다리가 6개예요."],
[4,1,1,"펭귄은 날개가 있지만 하늘을 날지 못하는 새다.","날개가 지느러미처럼 생겨서 물속에서 헤엄칠 때 써요."],
[4,1,0,"개구리는 뱀, 도마뱀과 같은 파충류에 속한다.","개구리는 양서류예요. 어릴 땐 올챙이로 물속에서 아가미로 숨 쉬어요."],
[4,1,1,"지금 살아 있는 동물 가운데 몸집이 가장 큰 것은 대왕고래다.","흰긴수염고래라고도 하고, 몸길이가 30m 가까이 자라요."],
[4,1,1,"오징어의 다리는 문어보다 두 개 더 많다.","오징어는 10개, 문어는 8개예요. 오징어는 긴 두 다리로 먹이를 잡아요."],
[4,1,0,"거북은 위험할 때 등딱지를 벗고 빠져나올 수 있다.","등딱지는 등뼈와 갈비뼈가 붙어 만들어진 몸의 일부예요."],
[4,1,1,"땅 위에 사는 동물 가운데 가장 빨리 달리는 것은 치타다.","짧은 거리에서는 시속 100km 가까이 달려요."],
[4,1,0,"제비는 겨울을 나러 우리나라에 오는 겨울 철새다.","제비는 봄에 와서 새끼를 키우고 가을에 남쪽으로 떠나는 여름 철새예요."],
[4,2,0,"낙타의 등에 있는 혹에는 물이 가득 들어 있다.","혹에는 지방이 들어 있어 먹이가 없을 때 힘을 내는 데 써요."],
[4,2,1,"해마는 수컷이 배 주머니에 알을 품었다가 새끼를 낳는다.","암컷이 수컷의 주머니에 알을 넣으면 수컷이 깨어날 때까지 품어요."],
[4,2,1,"상어의 뼈대는 물렁뼈(연골)로 이루어져 있다.","가오리도 같은 연골어류예요. 뼈대가 가볍고 잘 휘어요."],
[4,2,1,"사람의 피를 빨아 먹는 모기는 암컷이다.","알을 만들 영양분이 필요해서예요. 수컷은 꽃의 꿀이나 식물의 즙을 먹어요."],
[4,2,1,"홍학의 분홍빛 깃털 색은 먹이에서 나온다.","새우와 조류의 붉은 색소 때문이에요. 갓 깬 새끼는 회색빛이에요."],
[4,2,0,"코알라는 판다처럼 곰 무리에 속하는 동물이다.","코알라는 캥거루처럼 새끼를 배 주머니에서 키우는 유대류예요."],
[4,2,0,"연어는 바다에서 태어나 알을 낳으러 강을 거슬러 오른다.","강에서 태어나 바다에서 자란 뒤, 알을 낳으러 태어난 강으로 돌아와요."],
[4,2,0,"개는 사람처럼 온몸에서 땀을 흘려 체온을 낮춘다.","땀샘은 발바닥에 조금 있어요. 주로 혀를 내밀고 헐떡이며 열을 식혀요."],
[4,2,0,"코끼리는 코를 빨대처럼 써서 물을 곧바로 삼킨다.","코로 물을 빨아올린 뒤 입에 부어 넣어서 마셔요."],
[4,2,1,"꿀벌은 춤을 추어 동료에게 꽃이 있는 곳을 알린다.","엉덩이를 흔드는 방향과 시간으로 꽃까지의 방향과 거리를 알려 줘요."],
[4,3,0,"올빼미는 목을 한 바퀴(360도) 완전히 돌릴 수 있다.","목은 최대 270도쯤 돌아가요. 대신 눈알은 거의 움직이지 못해요."],
[4,3,1,"돌고래는 뇌의 절반씩 번갈아 가며 잠을 잔다.","숨을 쉬러 물 위로 올라가야 해서 한쪽 뇌는 깨어 있어요."],
[4,3,1,"하얀 털로 덮인 북극곰의 피부는 검은색이다.","털은 사실 투명한데 빛을 흩뜨려서 하얗게 보여요."],
[4,3,0,"투우에서 소는 망토의 빨간색을 보고 흥분해 달려든다.","소는 빨간색을 잘 구별하지 못해요. 펄럭이는 움직임을 보고 달려들어요."],
[4,3,1,"뱀은 눈꺼풀이 없어서 잠을 잘 때도 눈을 뜨고 있다.","대신 투명한 비늘이 눈을 덮어 먼지와 상처를 막아 줘요."],
[4,3,0,"하마는 물속에서 오래 지내는 만큼 헤엄을 아주 잘 친다.","헤엄을 치기보다 물 바닥을 걷거나 발로 차면서 움직여요."],
[4,3,1,"나비는 꽃이나 잎에 앉으면 발로 맛을 본다.","발끝에 맛을 느끼는 기관이 있어서 알 낳을 잎을 고를 때도 써요."],
[5,1,1,"식물은 햇빛을 받아 양분을 만들면서 산소를 내놓는다.","이것을 광합성이라고 해요. 주로 잎에서 일어나요."],
[5,1,0,"모든 나무는 겨울이 되면 잎이 다 떨어진다.","소나무, 잣나무 같은 늘푸른나무는 겨울에도 잎이 푸르러요."],
[5,1,1,"파리지옥은 잎을 덫처럼 닫아 벌레를 잡아먹는 식물이다.","잎 안쪽의 감각털이 잇달아 두 번 건드려지면 잎이 닫혀요."],
[5,1,0,"풀잎에 맺힌 이슬은 밤사이 내린 비가 남은 것이다.","공기 속 수증기가 차가워진 풀잎에 닿아 물방울로 맺힌 거예요."],
[5,1,1,"나무의 나이테는 보통 한 해에 하나씩 생긴다.","빨리 자라는 봄여름과 천천히 자라는 가을의 색이 달라 줄이 보여요."],
[5,1,1,"도토리는 참나무 종류의 나무에 열리는 열매다.","상수리나무, 신갈나무, 떡갈나무가 모두 참나무 무리예요."],
[5,1,0,"사막은 비가 한 방울도 내리지 않는 곳이다.","비가 아주 적게 오는 곳이에요. 보통 한 해에 250mm보다 적게 내려요."],
[5,2,1,"선인장의 가시는 잎이 변해서 생긴 것이다.","넓은 잎 대신 가시를 달아 몸속 물이 날아가는 것을 줄여요."],
[5,2,1,"땅콩은 꼬투리가 땅속에서 자라 여무는 식물이다.","꽃이 진 자리에서 가는 줄기가 땅속으로 파고들어 꼬투리를 맺어요."],
[5,2,1,"은행나무는 암나무와 수나무가 따로 있다.","고약한 냄새가 나는 은행 알은 암나무에만 열려요."],
[5,2,0,"버섯은 햇빛을 받아 광합성을 하는 식물의 한 종류다.","버섯은 곰팡이와 같은 균류예요. 죽은 나무나 다른 생물에서 양분을 얻어요."],
[5,2,1,"고사리는 꽃을 피우지 않고 홀씨로 번식한다.","잎 뒷면에서 만든 홀씨가 바람에 날려 퍼져요."],
[5,2,1,"개나리는 잎이 나기 전에 꽃이 먼저 핀다.","노란 꽃이 질 무렵에야 초록 잎이 돋아나요."],
[5,2,0,"벚나무는 꽃만 피고 열매는 맺지 않는다.","초여름에 버찌라는 작은 열매가 까맣게 익어요."],
[5,2,0,"겨울에 호수는 바닥부터 얼기 시작해 위로 올라온다.","얼음은 물보다 가벼워 위부터 얼어요. 그 아래 물에서 물고기가 겨울을 나요."],
[5,3,0,"해바라기는 꽃이 다 핀 뒤에도 하루 종일 해를 따라 고개를 돌린다.","어릴 때만 해를 따라 움직이고, 꽃이 피면 대개 동쪽을 본 채 멈춰요."],
[5,3,0,"우리가 먹는 감자는 식물의 뿌리가 굵어진 것이다.","감자는 땅속줄기가 굵어진 덩이줄기예요. 뿌리가 굵어진 건 고구마예요."],
[5,3,0,"가을에 잎이 노랗게 물드는 것은 노란 색소가 새로 생기기 때문이다.","초록 엽록소가 줄면서 원래 잎 속에 있던 노란 색소가 드러나는 거예요."],
[5,3,0,"북반구에서 태풍은 위에서 내려다볼 때 시계 방향으로 돈다.","북반구에서는 시계 반대 방향, 남반구에서는 시계 방향으로 돌아요."],
[5,3,1,"수국은 심은 흙의 성질에 따라 꽃 색이 달라진다.","산성 흙에서는 푸른빛, 알칼리성 흙에서는 붉은빛 꽃이 피기 쉬워요."],
[5,3,1,"사과나무는 장미와 같은 장미과 식물이다.","배, 복숭아, 딸기도 모두 장미과에 속해요."],
[5,3,1,"콩의 뿌리에는 공기 속 질소를 붙잡아 주는 세균이 산다.","뿌리혹박테리아 덕분에 콩은 거름이 적은 땅에서도 잘 자라요."],
[6,1,1,"지구에 있는 바다 가운데 가장 넓은 바다는 태평양이다.","지구 위의 땅을 모두 합친 것보다도 더 넓어요."],
[6,1,0,"지구 겉면을 넓이로 따지면 바다보다 육지가 더 넓다.","바다가 지구 겉면의 약 70%를 차지해요."],
[6,1,1,"바다 수면으로부터의 높이(해발)로 따지면 세계에서 가장 높은 산은 에베레스트산이다.","높이가 8800m를 넘고, 히말라야산맥에 있어요."],
[6,1,0,"미국의 수도는 자유의 여신상이 있는 뉴욕이다.","미국의 수도는 워싱턴 D.C.이고, 어느 주에도 속하지 않아요."],
[6,1,1,"캐나다 국기 한가운데에는 빨간 단풍잎이 그려져 있다.","캐나다는 단풍나무 수액을 졸여 만드는 메이플 시럽으로도 유명해요."],
[6,1,0,"오로라는 주로 적도와 가까운 지역의 밤하늘에서 볼 수 있다.","오로라는 북극이나 남극에 가까운 지역 하늘에서 주로 보여요."],
[6,1,0,"남반구에 있는 나라들은 12월이 한겨울이다.","남반구에서는 12월이 여름이라 크리스마스를 한여름에 보내요."],
[6,1,1,"이탈리아 땅은 바다 쪽으로 길게 뻗은 장화 모양이다.","장화 앞코 끝에 붙은 공처럼 시칠리아섬이 있어요."],
[6,2,0,"다섯 대양 가운데 가장 작은 바다는 인도양이다.","가장 작은 대양은 북극해예요. 인도양은 세 번째로 넓어요."],
[6,2,0,"북극에는 남극처럼 두꺼운 얼음 밑에 넓은 땅(대륙)이 있다.","북극은 바다가 얼어붙은 곳이고, 남극은 얼음 아래 땅이 있는 대륙이에요."],
[6,2,1,"지구에서 가장 깊은 바다 밑은 태평양의 마리아나 해구에 있다.","깊이가 1만 m가 넘어서 에베레스트산을 넣어도 다 잠겨요."],
[6,2,0,"북아메리카 나라 캐나다의 수도는 토론토다.","캐나다의 수도는 오타와예요. 토론토와 같은 온타리오주에 있어요."],
[6,2,0,"프랑스 파리 한가운데를 흐르는 강은 템스강이다.","파리를 흐르는 강은 센강이에요. 템스강은 영국 런던을 흘러요."],
[6,2,1,"나일강은 이집트를 지나 북쪽의 지중해로 흘러든다.","바다와 만나는 곳에 부채꼴 모양의 넓은 삼각주가 있어요."],
[6,2,1,"경도 0도인 본초 자오선은 영국 런던의 그리니치를 지난다.","이 선을 기준으로 세계 여러 나라의 시각을 정해요."],
[6,2,1,"남아메리카의 브라질 사람들은 주로 포르투갈어를 쓴다.","남아메리카의 다른 나라들은 대부분 스페인어를 써요."],
[6,2,0,"스위스는 바다와 맞닿은 해안이 있는 나라다.","스위스는 사방이 다른 나라에 둘러싸여 바다가 없는 내륙국이에요."],
[6,2,1,"북극과 가까운 곳에서는 여름에 밤에도 해가 지지 않는 날이 있다.","이를 백야라고 해요. 겨울에는 해가 뜨지 않는 극야가 찾아와요."],
[6,3,1,"남극은 북극보다 기온이 더 낮아 훨씬 춥다.","남극은 높고 두꺼운 얼음 대륙이라 바다 위에 있는 북극보다 추워요."],
[6,3,1,"러시아의 바이칼호는 세계에서 가장 깊은 호수다.","가장 깊은 곳이 1600m가 넘고, 아주 오래된 호수이기도 해요."],
[6,3,1,"남아메리카 에콰도르의 나라 이름은 스페인어로 '적도'라는 뜻이다.","이름처럼 적도가 나라의 북쪽을 지나가요."],
[6,3,1,"네팔 국기는 삼각형 두 개를 위아래로 겹쳐 놓은 모양이다.","네모가 아닌 나라 국기는 세계에서 네팔 국기 하나뿐이에요."],
[6,3,0,"유럽과 아시아에 걸친 나라 튀르키예의 수도는 이스탄불이다.","수도는 앙카라예요. 이스탄불은 해협을 사이에 두고 두 대륙에 걸쳐 있어요."],
[6,3,0,"수에즈 운하는 대서양과 태평양을 이어 주는 운하다.","수에즈 운하는 지중해와 홍해를 이어요. 두 대양을 잇는 건 파나마 운하예요."],
[6,3,0,"바다로 흘려보내는 물의 양이 세계에서 가장 많은 강은 나일강이다.","물의 양은 아마존강이 단연 가장 많아요. 나일강보다 수십 배 많아요."],
[7,1,1,"우리나라는 세 면이 바다로 둘러싸인 반도 나라다.","서쪽, 남쪽, 동쪽이 바다이고 북쪽만 대륙과 이어져 있어요."],
[7,1,1,"제주도는 화산이 폭발하면서 만들어진 섬이다.","섬 곳곳에 '오름'이라고 부르는 작은 화산이 수백 개 있어요."],
[7,1,0,"한강은 서울을 가로질러 동해로 흘러간다.","한강은 서울을 지나 서쪽으로 흘러 서해로 들어가요."],
[7,1,1,"전라남도 보성은 비탈진 녹차 밭으로 유명한 곳이다.","언덕을 따라 층층이 이어진 차밭이 관광지로도 이름났어요."],
[7,1,0,"경상북도 경주는 옛날 백제의 수도였다.","경주는 천 년 가까이 신라의 수도였고, 불국사와 석굴암이 있어요."],
[7,1,1,"우리나라 서해안에는 넓은 갯벌이 펼쳐져 있다.","밀물과 썰물 차이가 커서 생겼고, 세계 자연 유산으로도 올랐어요."],
[7,1,0,"화산섬인 울릉도는 우리나라 서해에 있다.","울릉도는 동해에 있어요. 오징어와 호박엿으로 유명해요."],
[7,1,0,"비빔밥과 한옥마을로 유명한 전주는 경상도에 있다.","전주는 전라도에 있어요. '전라도'라는 이름도 전주와 나주에서 따왔어요."],
[7,2,1,"우리나라 땅은 대체로 동쪽이 높고 서쪽이 낮다.","그래서 큰 강은 대부분 서해나 남해 쪽으로 흘러가요."],
[7,2,0,"동해안은 서해안보다 해안선이 훨씬 구불구불하고 섬이 많다.","동해안은 해안선이 단조로워요. 섬과 만이 많은 곳은 서해안과 남해안이에요."],
[7,2,0,"설악산에서 가장 높은 봉우리의 이름은 천왕봉이다.","설악산 꼭대기는 대청봉이에요. 천왕봉은 지리산 꼭대기 이름이에요."],
[7,2,1,"충청남도 금산은 인삼이 많이 나는 곳으로 유명하다.","금산에는 전국에서 손꼽히는 큰 인삼 시장이 있어요."],
[7,2,0,"'빛고을'이라는 별명으로 불리는 도시는 대전이다.","빛고을은 광주예요. 대전은 큰 밭이라는 뜻의 '한밭'으로 불려요."],
[7,2,1,"춘천은 호수가 많아 '호반의 도시'라고 불린다.","소양호, 의암호, 춘천호 같은 큰 호수가 도시를 둘러싸고 있어요."],
[7,2,1,"전라남도 진도에는 바닷물이 빠지면 바닷길이 열리는 곳이 있다.","섬과 섬 사이에 길이 드러나 사람들이 걸어서 건너요."],
[7,2,1,"낙동강은 경상도 땅을 지나 부산에서 바다로 흘러든다.","태백의 황지연못이 낙동강이 시작되는 곳으로 알려져 있어요."],
[7,2,0,"우리나라 겨울에는 주로 남동쪽에서 따뜻한 바람이 불어온다.","겨울에는 북서쪽 대륙에서 차고 메마른 바람이 불어와요."],
[7,2,0,"대구는 바닷가에 있어 큰 배가 드나드는 항구 도시다.","대구는 산으로 둘러싸인 분지라 여름에 무척 더워요."],
[7,3,0,"섬진강은 전라도와 경상도 사이를 지나 서해로 흘러든다.","섬진강은 남쪽으로 흘러 남해의 광양만으로 들어가요."],
[7,3,0,"굴비로 유명한 영광은 우리나라 동해안에 있다.","영광은 전라남도 서해안에 있어요. 법성포 굴비가 이름났어요."],
[7,3,0,"우리나라에서 첫 번째로 지정된 국립공원은 설악산이다.","첫 국립공원은 1967년에 지정된 지리산이에요."],
[7,3,1,"안동 하회마을은 낙동강이 마을을 휘감아 돌아 흐른다.","물이 돌아 흐른다는 뜻의 '하회'라는 이름도 여기서 나왔어요."],
[7,3,1,"인천국제공항은 섬과 섬 사이의 바다를 메워 지었다.","영종도와 용유도 사이 갯벌을 메워 넓은 땅을 만들었어요."],
[7,3,1,"충청북도 단양에는 석회암이 녹아서 생긴 동굴이 많다.","고수동굴, 온달동굴 같은 석회암 동굴이 관광지로 알려져 있어요."],
[7,3,0,"제주 바닷가의 육각기둥 모양 바위(주상절리)는 파도가 깎아 만든 것이다.","뜨거운 용암이 빠르게 식으면서 갈라져 생긴 거예요."],
[8,1,1,"고조선을 세웠다고 전해지는 인물은 단군왕검이다.","일연이 쓴 삼국유사에 이 건국 이야기가 실려 있어요."],
[8,1,1,"황산벌 전투에서 백제군을 이끈 장군은 계백이다.","660년 김유신이 이끄는 신라군과 맞서 싸웠어요."],
[8,1,0,"귀주대첩에서 거란군을 크게 물리친 장수는 을지문덕이다.","1019년 고려의 강감찬이 이끈 싸움이고 을지문덕은 고구려 장수예요."],
[8,1,1,"고려 말 문익점은 원나라에서 목화씨를 들여왔다.","장인 정천익과 함께 목화를 길러 널리 퍼뜨렸어요."],
[8,1,0,"조선 시대 지도인 대동여지도를 만든 사람은 정약용이다.","김정호가 1861년에 목판으로 찍어 펴낸 지도예요."],
[8,1,1,"수원 화성은 조선 정조 때 쌓은 성이다.","1796년에 완성되었고 유네스코 세계유산이에요."],
[8,1,1,"한산도 대첩을 승리로 이끈 장군은 이순신이다.","1592년 학이 날개를 펴듯 적을 감싸는 학익진으로 이겼어요."],
[8,1,0,"삼국 가운데 고구려를 세운 사람은 온조이다.","고구려는 주몽이 세웠고 온조는 백제를 세웠어요."],
[8,2,0,"살수대첩에서 을지문덕이 물리친 나라는 당나라이다.","612년 쳐들어온 수나라 대군을 살수에서 무찔렀어요."],
[8,2,1,"서희는 거란 장수와 담판을 지어 강동 6주를 얻었다.","993년 거란 장수 소손녕을 만나 말로 군대를 물러가게 했어요."],
[8,2,1,"장보고는 완도에 청해진을 두고 바다 무역을 이끌었다.","828년 무렵 흥덕왕의 허락을 받아 청해진을 세웠어요."],
[8,2,1,"발해를 세우고 첫 임금이 된 사람은 대조영이다.","698년에 세웠고 해동성국이라 불릴 만큼 번성했어요."],
[8,2,0,"경주 토함산의 석굴암은 고려 시대에 만들어졌다.","통일 신라 때인 8세기 중반에 짓기 시작했어요."],
[8,2,1,"경주의 첨성대는 신라 선덕여왕 때 만들어졌다.","돌을 쌓아 만들었고 지금은 국보로 지정되어 있어요."],
[8,2,0,"규장각은 세종이 세운 학문 연구 기관이다.","정조가 1776년 창덕궁 안에 세운 기관이에요."],
[8,2,1,"상감 기법으로 무늬를 넣은 청자는 고려에서 발달했다.","그릇에 무늬를 판 뒤 다른 색 흙을 메워 넣었어요."],
[8,2,0,"고조선의 8조법은 여덟 조목이 모두 지금까지 전해진다.","중국 역사책 한서에 세 조목만 전해지고 있어요."],
[8,3,0,"조선은 세워진 해부터 한양을 도읍으로 삼았다.","1392년 개경에서 세웠고 1394년에 한양으로 옮겼어요."],
[8,3,0,"경복궁은 임진왜란 때 불탄 뒤 곧바로 다시 지어졌다.","270년 넘게 비어 있다가 고종 때 흥선대원군이 다시 지었어요."],
[8,3,1,"금속 활자로 찍은 책 직지는 청주 흥덕사에서 인쇄되었다.","1377년에 찍었고 지금은 프랑스 국립도서관에 있어요."],
[8,3,1,"무령왕릉에서는 무덤 주인이 누구인지 알려 주는 지석이 나왔다.","1971년 충남 공주에서 배수로 공사를 하다 발견했어요."],
[8,3,1,"대동법은 광해군 때 경기도에서 처음 시행되었다.","특산물 대신 쌀 등으로 세금을 내게 한 제도예요."],
[8,3,0,"조선의 기본 법전인 경국대전은 세종 때 완성되었다.","세조 때 만들기 시작해 성종 때 완성했어요."],
[8,3,0,"고구려가 도읍을 평양으로 옮긴 것은 광개토대왕 때이다.","아들 장수왕이 427년에 국내성에서 평양으로 옮겼어요."],
[9,1,0,"고대 올림픽 경기는 로마에서 처음 시작되었다.","그리스 올림피아에서 4년마다 제우스를 기리며 열렸어요."],
[9,1,0,"뉴욕에 있는 자유의 여신상은 영국이 미국에 선물했다.","프랑스가 미국 독립 100주년을 기념해 보냈어요."],
[9,1,1,"기원전 221년 중국을 처음 통일한 진나라 왕은 진시황이다.","스스로 '황제'라는 칭호를 처음 쓴 사람이에요."],
[9,1,1,"흩어진 몽골 부족을 모아 몽골 제국을 세운 사람은 칭기즈 칸이다.","1206년 부족 회의에서 '칭기즈 칸'이라는 칭호를 받았어요."],
[9,1,1,"이탈리아 로마의 콜로세움은 고대 원형 경기장이다.","검투사 경기가 열렸고 수만 명이 들어갈 수 있었어요."],
[9,1,1,"콜럼버스가 대서양을 건너 아메리카에 닿은 해는 1492년이다.","스페인 왕실의 지원을 받아 배 세 척으로 떠났어요."],
[9,1,1,"고대 이집트 사람들은 죽은 사람의 몸을 미라로 만들었다.","몸이 남아 있어야 저세상에서 다시 살 수 있다고 믿었어요."],
[9,2,1,"로제타석은 이집트 상형 문자를 풀어내는 열쇠가 되었다.","1822년 프랑스의 샹폴리옹이 해독에 성공했어요."],
[9,2,1,"함무라비 법전은 메소포타미아의 바빌로니아에서 만들어졌다.","기원전 18세기 무렵 돌기둥에 법 조항을 새겼어요."],
[9,2,1,"타지마할은 무굴 제국의 황제가 왕비를 기려 지은 무덤이다.","샤자한이 세상을 떠난 아내 뭄타즈 마할을 위해 지었어요."],
[9,2,1,"에펠탑은 1889년 파리 만국 박람회에 맞춰 세워졌다.","처음에는 20년만 세워 두기로 하고 지은 탑이에요."],
[9,2,1,"마리 퀴리는 노벨상을 두 차례 받은 과학자이다.","1903년에 물리학상, 1911년에 화학상을 받았어요."],
[9,2,0,"산꼭대기 도시 유적 마추픽추는 아즈텍 문명이 남겼다.","페루 안데스산맥에 있는 잉카 제국의 유적이에요."],
[9,2,0,"고대 아테네에서는 모든 주민이 투표에 참여할 수 있었다.","성인 남자 시민만 투표했고 여성과 노예는 못 했어요."],
[9,2,0,"산업 혁명은 미국에서 처음 시작되었다.","18세기 후반 영국의 면직물 공업에서 시작됐어요."],
[9,2,0,"미국의 독립 선언서는 1789년에 발표되었다.","1776년 7월 4일에 발표했고 이날이 독립기념일이에요."],
[9,2,0,"항생제 페니실린을 발견한 사람은 파스퇴르이다.","1928년 영국의 플레밍이 푸른곰팡이에서 찾아냈어요."],
[9,3,0,"로마 제국의 첫 황제는 율리우스 카이사르이다.","첫 황제는 카이사르의 양아들 아우구스투스예요."],
[9,3,0,"마젤란은 세계 일주를 마치고 스페인으로 돌아왔다.","1521년 필리핀에서 숨졌고 남은 선원들이 돌아왔어요."],
[9,3,0,"북유럽의 바이킹은 싸울 때 뿔 달린 투구를 썼다.","뿔 투구는 19세기 오페라 무대 의상에서 퍼진 모습이에요."],
[9,3,0,"소크라테스는 자기 생각을 직접 책으로 써서 남겼다.","직접 쓴 글이 없어 제자 플라톤 등의 책으로 전해져요."],
[9,3,1,"동로마 제국은 1453년 오스만 제국에 수도 콘스탄티노플을 빼앗겼다.","이 도시가 지금 튀르키예의 이스탄불이에요."],
[9,3,1,"마그나 카르타는 1215년 영국에서 만들어졌다.","귀족들의 요구로 존 왕이 자기 권한을 줄이는 데 동의했어요."],
[9,3,1,"바스쿠 다가마는 아프리카 남쪽을 돌아 인도로 가는 바닷길을 열었다.","1498년 인도 캘리컷에 닿으며 이 뱃길을 열었어요."],
[10,1,0,"'내가 먼저 할께'에서 '할께'가 바른 표기다.","소리는 [께]로 나도 '할게'로 적어요."],
[10,1,0,"길거리 간식 이름은 '떡볶기'로 적는 것이 바르다.","'볶다'에 '-이'가 붙은 말이라 '떡볶이'로 적어요."],
[10,1,0,"손가락으로 어느 쪽을 집어 보일 때는 '가르치다'를 쓴다.","이때는 '가리키다'를 쓰고 지식을 알려 줄 땐 '가르치다'예요."],
[10,1,1,"'모레'는 내일의 다음 날을 뜻하는 말이다.","모레의 다음 날은 '글피'라고 해요."],
[10,1,1,"'소 잃고 외양간 고친다'는 일이 잘못된 뒤에 뒤늦게 손쓴다는 뜻이다.","일이 터지기 전에 미리 대비하라는 가르침이 담겼어요."],
[10,1,0,"'원숭이도 나무에서 떨어진다'는 남을 흉내 내지 말라는 뜻이다.","아무리 잘하는 사람도 실수할 때가 있다는 뜻이에요."],
[10,1,1,"'작심삼일'은 결심이 오래가지 못한다는 뜻이다.","마음먹은 것이 사흘을 못 간다는 데서 나온 말이에요."],
[10,1,1,"'일석이조'는 한 가지 일로 두 가지 이득을 본다는 뜻이다.","돌 하나를 던져 새 두 마리를 잡는다는 말이에요."],
[10,2,0,"'금일 휴업'의 '금일'은 금요일을 줄인 말이다.","'금일(今日)'은 오늘을 뜻하는 한자어예요."],
[10,2,0,"날을 세는 말 '사흘'은 4일 동안을 뜻한다.","사흘은 3일이고 4일은 '나흘'이라고 해요."],
[10,2,0,"카드로 물건값을 치르는 것은 '결재'라고 한다.","값을 치르는 건 '결제', 윗사람의 승인은 '결재'예요."],
[10,2,0,"'금새 다 먹었다'에서 '금새'가 바른 표기다.","'금시에'가 줄어든 말이라 '금세'로 적어요."],
[10,2,0,"'오십보백보'는 차이가 아주 크다는 뜻이다.","조금 차이 날 뿐 본질은 같다는 뜻으로 맹자에 나와요."],
[10,2,1,"'어떡해'는 '어떻게 해'가 줄어든 말이다.","'이를 어떡해'처럼 '어떻게 해' 자리에 써요."],
[10,2,1,"'청출어람'은 제자가 스승보다 나음을 이르는 말이다.","쪽에서 얻은 푸른 물감이 쪽보다 더 푸르다는 데서 왔어요."],
[10,2,1,"'가랑비에 옷 젖는 줄 모른다'는 작은 것도 쌓이면 커진다는 뜻이다.","사소한 일이라도 되풀이되면 가볍게 볼 수 없다는 말이에요."],
[10,2,1,"'안 돼'의 '돼'는 '되어'가 줄어든 말이다.","'되어'로 바꿔도 말이 되면 '돼'로 적어요."],
[10,2,1,"'오랜만'은 '오래간만'이 줄어든 말이다.","그래서 '오랫만'이 아니라 '오랜만'으로 적어요."],
[10,3,0,"바라는 일을 뜻하는 말은 '바램'이 표준어다.","'바라다'에서 온 '바람'이 표준어예요."],
[10,3,0,"'타산지석'은 본받을 만한 훌륭한 모범을 뜻한다.","남의 잘못이나 하찮은 일도 내게 교훈이 된다는 뜻이에요."],
[10,3,1,"'칠칠하다'는 깨끗하고 단정하거나 야무지다는 뜻이다.","그래서 흉볼 때는 '칠칠하지 못하다'처럼 써요."],
[10,3,1,"'너무 좋다'처럼 좋은 뜻에도 '너무'를 쓸 수 있다.","2015년 사전 뜻풀이가 바뀌어 긍정에도 쓰게 되었어요."],
[10,3,0,"'흡연을 삼가해 주세요'가 바른 표현이다.","기본형이 '삼가다'라서 '삼가 주세요'로 써요."],
[10,3,1,"'심심한 사과'의 '심심하다'는 마음이 깊고 간절하다는 뜻이다.","'심할 심, 깊을 심' 자를 써서 지루하다는 뜻과 달라요."],
[10,3,1,"'함흥차사'는 심부름 간 사람이 소식 없이 돌아오지 않을 때 쓰는 말이다.","태조 이성계가 머물던 함흥에 보낸 차사 이야기에서 왔어요."],
[11,1,1,"설날 아침에 먹는 대표적인 음식은 떡국이다.","떡국을 먹어야 나이를 한 살 더 먹는다고 여겼어요."],
[11,1,0,"추석은 음력 1월 15일에 쇠는 명절이다.","추석은 음력 8월 15일이고 1월 15일은 정월 대보름이에요."],
[11,1,0,"윷놀이에서 '걸'이 나오면 말을 두 칸 옮긴다.","걸은 세 칸을 가고 두 칸을 가는 건 '개'예요."],
[11,1,0,"설날 아침 웃어른께 올리는 절을 '차례'라고 한다.","웃어른께 하는 절은 '세배'이고 '차례'는 조상께 올리는 의례예요."],
[11,1,1,"된장을 담글 때 쓰는 메주는 주로 콩으로 만든다.","삶은 콩을 찧어 네모나게 빚은 뒤 말리고 띄워요."],
[11,1,1,"온돌은 아궁이에 불을 때서 방바닥을 데우는 난방 방식이다.","불길과 연기가 구들장 밑을 지나며 방을 데워요."],
[11,1,1,"서울의 숭례문은 흔히 남대문이라고 부른다.","조선 시대 한양 도성의 남쪽 정문이에요."],
[11,1,0,"동지는 1년 가운데 낮이 가장 긴 날이다.","동지는 밤이 가장 길고 낮이 가장 긴 날은 하지예요."],
[11,2,0,"단오는 음력 7월 7일에 쇠는 명절이다.","단오는 음력 5월 5일이고 7월 7일은 칠석이에요."],
[11,2,0,"강강술래는 주로 남자들이 손을 잡고 원을 도는 놀이이다.","주로 여자들이 추석 밤에 손잡고 노래하며 돌았어요."],
[11,2,0,"판소리는 여러 소리꾼이 역할을 나눠 부르는 공연이다.","소리꾼 한 사람이 고수의 북 장단에 맞춰 불러요."],
[11,2,0,"한복 저고리의 앞을 여미는 끈을 '대님'이라고 한다.","저고리 끈은 '옷고름'이고 대님은 바짓부리를 묶는 끈이에요."],
[11,2,0,"서울의 흥인지문은 한양 도성의 서쪽 큰 문이다.","동쪽 문이라서 흔히 동대문이라고 불러요."],
[11,2,1,"김장 문화는 유네스코 인류무형문화유산에 올라 있다.","2013년에 김치를 담그고 나누는 문화로 올랐어요."],
[11,2,1,"정월 대보름에는 땅콩이나 호두 같은 부럼을 깨물었다.","한 해 동안 부스럼이 나지 않기를 빌었어요."],
[11,2,1,"한식에는 불을 피우지 않고 찬 음식을 먹었다.","동지에서 105일째 되는 날로 조상 묘도 돌봤어요."],
[11,2,1,"하회탈은 경북 안동 하회 마을에서 전해 온 탈이다.","병산탈과 함께 국보로 지정되어 있어요."],
[11,2,1,"방패연은 가운데에 둥근 구멍이 뚫려 있다.","이 구멍을 '방구멍'이라 하며 센 바람에도 연이 잘 버텨요."],
[11,3,0,"봉산 탈춤은 경상도 지방에서 전해 온 탈춤이다.","황해도 봉산 지방에서 이어져 온 탈춤이에요."],
[11,3,0,"24절기는 달의 움직임을 기준으로 정했다.","해의 움직임으로 정해서 양력 날짜가 해마다 거의 같아요."],
[11,3,0,"평소 두 손을 모아 절할 때 남자는 오른손을 위로 올린다.","평소엔 남자는 왼손, 여자는 오른손을 위로 포개요."],
[11,3,1,"정월 대보름 아침에 마시는 술을 '귀밝이술'이라고 한다.","데우지 않은 술을 마시며 귀가 밝아지기를 빌었어요."],
[11,3,1,"간장을 담글 때 장독에 숯과 붉은 고추를 띄웠다.","숯은 잡내를 빨아들이고 고추는 나쁜 기운을 쫓는다고 여겼어요."],
[11,3,1,"음력 3월 3일 삼짇날에는 진달래로 화전을 부쳐 먹었다.","강남 갔던 제비가 돌아온다는 날이기도 해요."],
[11,3,1,"옛날 여자의 성인식은 비녀를 꽂는 '계례'였다.","남자는 상투를 틀고 갓을 쓰는 '관례'를 치렀어요."],
[12,1,1,"축구는 한 팀이 경기장에 11명씩 들어가 경기한다.","한 팀 선수가 7명보다 적어지면 경기를 이어 갈 수 없어요."],
[12,1,0,"야구에서 타자가 볼을 세 개 고르면 1루로 걸어 나간다.","볼을 네 개 골라야 1루로 나가서 '볼넷'이라고 불러요."],
[12,1,0,"농구는 한 팀이 코트에 6명씩 나와 경기한다.","농구는 5명씩 뛰고, 배구가 한 팀 6명씩 코트에 서요."],
[12,1,0,"축구에서는 한 경기에 옐로카드를 세 번 받아야 퇴장된다.","같은 경기에서 옐로카드를 두 번 받으면 바로 퇴장이에요."],
[12,1,1,"골프는 정규 한 라운드에 18개 홀을 돈다.","1~9번 홀을 아웃코스, 10~18번 홀을 인코스라고 불러요."],
[12,1,0,"서울에서 하계 올림픽이 열린 해는 1986년이다.","1986년엔 서울 아시안게임이 열렸고, 올림픽은 1988년이에요."],
[12,1,1,"올림픽 육상 경기장의 트랙은 한 바퀴가 400m다.","가장 안쪽 레인 기준이라 바깥 레인은 출발선이 더 앞에 있어요."],
[12,1,1,"씨름은 모래판 위에서 샅바를 잡고 겨루는 운동이다.","상대의 무릎 위 몸이 먼저 땅에 닿게 하면 이겨요."],
[12,2,1,"배구에서 한 팀은 공을 세 번 안에 상대편으로 넘겨야 한다.","블로킹하다 공에 닿은 건 세 번 안에 넣어 세지 않아요."],
[12,2,0,"테니스 점수는 15점, 30점, 45점 순서로 올라간다.","15, 30 다음은 40이고, 0점은 '러브'라고 불러요."],
[12,2,1,"윔블던 테니스 대회는 잔디 코트에서 열린다.","1877년에 처음 열린, 가장 오래된 테니스 대회예요."],
[12,2,0,"골프에서 기준 타수보다 한 타 많이 치면 '버디'라고 한다.","한 타 적게 치면 버디, 한 타 많이 치면 '보기'예요."],
[12,2,0,"올림픽 수영 100m 경기는 수영장을 두 번 왕복해야 끝난다.","올림픽 수영장은 길이가 50m라서 한 번만 왕복하면 돼요."],
[12,2,0,"근대 올림픽 첫 대회는 1896년 프랑스 파리에서 열렸다.","첫 대회는 그리스 아테네였고, 파리는 1900년 두 번째 대회예요."],
[12,2,1,"올림픽 성화는 그리스 올림피아에서 햇빛을 모아 불을 붙인다.","오목거울로 붙인 불을 사람들이 이어 달리며 개최지로 옮겨요."],
[12,2,0,"올림픽 금메달은 속까지 모두 순금으로 만든다.","은으로 만든 메달 겉에 금을 6g 이상 입혀요."],
[12,2,0,"오늘날 바둑에서는 백돌을 쥔 사람이 먼저 둔다.","흑이 먼저 두고, 먼저 두는 만큼 유리해서 백에게 덤을 줘요."],
[12,2,1,"양궁 과녁은 가장 안쪽 원을 맞히면 10점이다.","과녁 색은 바깥부터 흰색, 검은색, 파란색, 빨간색, 노란색이에요."],
[12,3,0,"태권도는 1988년 서울 올림픽부터 정식 종목이 됐다.","서울 올림픽 땐 시범 종목이었고, 2000년 시드니 대회부터 정식이에요."],
[12,3,1,"첫 FIFA 월드컵은 1930년 우루과이에서 열렸다.","개최국 우루과이가 결승에서 아르헨티나를 이기고 우승했어요."],
[12,3,1,"수영 자유형 종목에서는 어떤 영법으로 헤엄쳐도 된다.","가장 빠른 영법이 크롤이라서 다들 크롤로 헤엄칠 뿐이에요."],
[12,3,1,"농구는 1891년 미국에서 제임스 네이스미스가 처음 고안했다.","처음에는 복숭아 바구니를 골대 삼아 높이 매달았어요."],
[12,3,1,"쇼트트랙 스피드스케이팅 트랙은 한 바퀴가 111.12m다.","아이스하키를 하는 크기의 링크 안에 트랙을 그려서 써요."],
[12,3,0,"펜싱 사브르 종목은 칼끝으로 찔렀을 때만 점수가 난다.","사브르는 칼날로 베어도 점수가 나고, 찌르기만 되는 건 에페와 플뢰레예요."],
[12,3,1,"1994년부터 하계와 동계 올림픽이 2년 간격으로 열리게 됐다.","1992년까지는 두 대회가 같은 해에 열렸어요."],
[13,1,1,"두부는 콩을 갈아 끓인 물을 굳혀서 만든다.","간수 같은 응고제를 넣으면 콩물 속 단백질이 엉겨요."],
[13,1,0,"고소한 들기름은 참깨를 볶아 짜서 만든 기름이다.","들기름은 들깨로 짜고, 참깨로 짠 건 참기름이에요."],
[13,1,0,"건포도는 자두를 햇볕에 말려 만든 것이다.","건포도는 포도를 말린 것이고, 말린 자두는 '프룬'이라고 해요."],
[13,1,0,"잠을 깨우는 카페인은 커피에만 들어 있는 성분이다.","녹차, 홍차, 콜라, 초콜릿에도 카페인이 들어 있어요."],
[13,1,1,"송편은 추석에 빚어 먹는 대표적인 떡이다.","솔잎을 깔고 쪄서 '송편'이라는 이름이 붙었어요."],
[13,1,1,"국물에 쌀국수를 말아 먹는 '포'는 베트남 음식이다.","숙주나물, 고수 같은 채소를 얹고 라임즙을 뿌려 먹기도 해요."],
[13,1,1,"빵 반죽에 이스트를 넣으면 반죽이 부풀어 오른다.","이스트가 당을 먹고 내뿜는 이산화탄소 때문이에요."],
[13,1,1,"어묵은 생선 살을 갈아 반죽해서 만든다.","생선 살에 소금과 녹말 등을 섞어 찌거나 튀겨 만들어요."],
[13,2,0,"똠얌꿍은 베트남을 대표하는 국물 요리다.","똠얌꿍은 태국 요리로, 새우를 넣어 새콤하고 매운맛이 나요."],
[13,2,0,"티라미수는 프랑스에서 생겨난 디저트다.","이탈리아 디저트로, 커피 적신 과자 위에 치즈 크림을 얹어요."],
[13,2,0,"같은 무게라면 탄수화물이 지방보다 열량이 높다.","1g당 열량은 지방이 9kcal, 탄수화물이 4kcal쯤이에요."],
[13,2,0,"갈색 달걀이 흰 달걀보다 영양가가 훨씬 높다.","껍데기 색은 닭 품종에 따라 다를 뿐 영양은 거의 같아요."],
[13,2,0,"동짓날에는 전통적으로 미역국을 끓여 먹는다.","동짓날엔 팥죽을 쑤어 먹고, 미역국은 생일에 먹어요."],
[13,2,1,"식혜는 엿기름을 우린 물로 밥을 삭혀 단맛을 낸다.","엿기름 속 효소가 밥의 녹말을 단 당분으로 바꿔요."],
[13,2,1,"우리 전통 간장과 된장은 모두 메주로 담근다.","메주를 소금물에 담가 우린 물은 간장, 건더기는 된장이 돼요."],
[13,2,1,"비타민 C가 오래 부족하면 괴혈병에 걸릴 수 있다.","옛날 배를 오래 타던 선원들이 이 병에 많이 걸렸어요."],
[13,2,1,"파에야는 쌀에 고기나 해산물을 넣고 넓은 팬에 익힌 스페인 요리다.","스페인 동쪽 발렌시아 지방에서 시작된 음식이에요."],
[13,3,1,"녹차와 홍차는 같은 종류의 차나무 잎으로 만든다.","찻잎을 바로 익혀 말리면 녹차, 산화시키면 홍차가 돼요."],
[13,3,0,"커피콩은 강낭콩처럼 콩 종류 식물에서 열리는 열매다.","커피콩은 커피나무 열매 속에 든 씨앗이에요."],
[13,3,0,"물에 소금을 넣으면 더 낮은 온도에서 끓는다.","소금을 녹이면 끓는점이 오히려 아주 조금 올라가요."],
[13,3,1,"달걀을 오래 삶으면 노른자 겉이 초록빛으로 변할 수 있다.","흰자의 황과 노른자의 철이 만나 생긴 색이라 먹어도 괜찮아요."],
[13,3,0,"소고기를 구울 때 나오는 붉은 물은 대부분 피다.","근육 속 단백질인 미오글로빈이 물에 섞여 붉게 보여요."],
[13,3,1,"젤리를 굳힐 때 쓰는 젤라틴은 동물의 뼈나 껍질에서 얻는다.","식물성 한천은 우뭇가사리 같은 바닷말로 만들어요."],
[13,3,0,"말갛고 하얀 청포묵은 메밀 가루로 쑤어 만든다.","청포묵은 녹두 녹말로 쑤고, 메밀로 쑨 건 메밀묵이에요."],
[14,1,0,"'모나리자'는 미켈란젤로가 그린 그림이다.","레오나르도 다빈치의 그림이고, 미켈란젤로는 '다비드상'을 조각했어요."],
[14,1,1,"'별이 빛나는 밤'은 빈센트 반 고흐가 그린 그림이다.","소용돌이치는 밤하늘을 굵은 붓 자국으로 그려 냈어요."],
[14,1,1,"'생각하는 사람'은 프랑스 조각가 로댕의 작품이다.","원래 커다란 청동 문을 꾸미는 조각 가운데 하나로 만들었어요."],
[14,1,0,"바이올린에는 활로 켜는 줄이 여섯 개 있다.","바이올린 줄은 네 개이고, 줄이 여섯 개인 건 기타예요."],
[14,1,0,"'흥부전'에서 다친 제비의 다리를 고쳐 준 사람은 놀부다.","흥부가 고쳐 준 제비가 박씨를 물어다 줘서 흥부는 부자가 돼요."],
[14,1,1,"'춘향전'에서 성춘향이 사랑한 사람은 이몽룡이다.","두 사람은 단옷날 남원 광한루에서 처음 만나요."],
[14,1,1,"악보를 그리는 오선지에는 가로줄이 다섯 개 있다.","줄은 맨 아래부터 첫째 줄, 둘째 줄 하고 위로 세요."],
[14,1,1,"피노키오는 거짓말을 하면 코가 길어지는 나무 인형이다.","이탈리아 작가 카를로 콜로디가 쓴 동화예요."],
[14,2,0,"입체파 화가 피카소는 프랑스에서 태어났다.","스페인 말라가에서 태어나 프랑스에서 주로 활동했어요."],
[14,2,1,"그림 '절규'는 노르웨이 화가 뭉크의 작품이다.","같은 제목으로 그림과 판화 등 여러 점을 만들었어요."],
[14,2,0,"바이올린 협주곡 '사계'는 바흐가 작곡했다.","이탈리아 작곡가 비발디의 곡으로, 봄, 여름, 가을, 겨울 네 곡이에요."],
[14,2,0,"'피아노의 시인'이라 불리는 쇼팽은 독일 출신 작곡가다.","쇼팽은 폴란드 출신으로, 피아노곡을 아주 많이 남겼어요."],
[14,2,0,"동화 '인어공주'는 독일 그림 형제가 엮은 이야기다.","인어공주는 덴마크 작가 안데르센이 쓴 동화예요."],
[14,2,0,"소설 '소나기'는 김유정이 쓴 작품이다.","'소나기'는 황순원 작품이고, 김유정은 '봄봄', '동백꽃'을 썼어요."],
[14,2,0,"영화 '사운드 오브 뮤직'의 배경이 된 나라는 스위스다.","배경은 오스트리아 잘츠부르크이고, '도레미 송'이 이 영화 노래예요."],
[14,2,1,"'어린 왕자'는 프랑스 작가 생텍쥐페리가 쓴 책이다.","작가는 비행기 조종사였고, 책 속 그림도 직접 그렸어요."],
[14,2,1,"찰리 채플린은 소리 없는 무성 영화 시대에 이름을 날린 배우다.","콧수염에 지팡이, 헐렁한 바지 차림의 떠돌이 역으로 유명해요."],
[14,3,0,"셰익스피어 4대 비극에는 '로미오와 줄리엣'이 들어간다.","4대 비극은 햄릿, 오셀로, 리어왕, 맥베스예요."],
[14,3,0,"칸 영화제의 최고상은 '황금사자상'이다.","칸은 황금종려상이고, 황금사자상은 베네치아 영화제의 상이에요."],
[14,3,1,"'인상주의'라는 이름은 모네의 그림 '인상, 해돋이'에서 나왔다.","한 비평가가 이 그림 제목을 비꼬아 쓴 말이 그대로 굳었어요."],
[14,3,0,"'씨름', '서당'을 그린 조선 화가 김홍도의 호는 '겸재'다.","김홍도의 호는 단원이고, 겸재는 '인왕제색도'를 그린 정선의 호예요."],
[14,3,1,"디즈니의 첫 장편 만화 영화는 '백설공주와 일곱 난쟁이'다.","1937년에 나왔고, 장면을 하나하나 손으로 그려 만들었어요."],
[14,3,1,"거문고는 대나무 막대인 술대로 줄을 쳐서 소리를 낸다.","가야금은 술대 없이 손가락으로 줄을 뜯어 소리를 내요."],
[14,3,1,"고려청자 특유의 푸른 빛깔을 '비색'이라고 부른다.","무늬를 파고 다른 흙을 메워 넣는 상감청자가 특히 유명해요."],
[15,1,1,"만 원짜리 지폐 앞면에는 세종대왕이 그려져 있다.","뒷면에는 별을 관측하던 기구인 '혼천의'가 그려져 있어요."],
[15,1,0,"천 원짜리 지폐에 그려진 인물은 이순신 장군이다.","천 원권 인물은 퇴계 이황이고, 이순신은 100원 동전에 있어요."],
[15,1,1,"윤년이 되면 2월이 평소보다 하루 많은 29일까지 있다.","윤년은 대개 4년에 한 번 돌아오고, 그해는 366일이에요."],
[15,1,1,"우리나라에서 자동차는 도로의 오른쪽으로 다닌다.","영국과 일본은 반대로 도로의 왼쪽으로 다녀요."],
[15,1,0,"집에 불이 났을 때 신고하는 전화번호는 112다.","불이 나거나 응급 환자가 생기면 119, 범죄 신고는 112예요."],
[15,1,1,"전자레인지에 쿠킹 포일을 넣고 돌리면 불꽃이 튈 수 있다.","포일의 뾰족한 끝에 전기가 몰리면서 불꽃이 생겨요."],
[15,2,1,"500원짜리 동전에는 날개를 편 학이 새겨져 있다.","50원 동전엔 벼 이삭, 10원 동전엔 다보탑이 새겨져 있어요."],
[15,2,1,"길이를 재는 단위 1인치는 2.54cm와 같다.","TV나 모니터 크기는 화면 대각선 길이를 인치로 나타내요."],
[15,2,1,"집 넓이를 말할 때 쓰는 1평은 약 3.3㎡다.","공식 문서에는 평 대신 ㎡ 단위를 쓰도록 정해져 있어요."],
[15,2,1,"1년 열두 달 가운데 31일까지 있는 달은 7개다.","1월, 3월, 5월, 7월, 8월, 10월, 12월이 31일까지 있어요."],
[15,2,0,"비행기 블랙박스는 이름처럼 검은색으로 칠한다.","사고가 나도 찾기 쉽게 눈에 잘 띄는 주황색으로 칠해요."],
[15,2,0,"같은 1.5V 건전지라도 AAA가 AA보다 크기가 더 크다.","AAA가 더 가늘고 짧아서 작은 리모컨이나 장난감에 많이 써요."],
[15,2,1,"고속 열차 KTX는 2004년에 처음 개통했다.","처음에는 경부선과 호남선 두 노선에서 달리기 시작했어요."],
[15,2,1,"락스를 산성 세제와 섞으면 몸에 해로운 가스가 생긴다.","독한 염소 기체가 나오니 락스는 다른 세제와 섞지 마세요."],
[15,2,1,"우리나라 가정의 콘센트에는 220V 전기가 흐른다.","미국은 120V, 일본은 100V를 써서 플러그 모양도 달라요."],
[15,3,0,"4로 나누어떨어지는 해는 모두 윤년이다.","1900년처럼 100으로 나뉘고 400으로 안 나뉘는 해는 평년이에요."],
[15,3,0,"골프에서도 쓰는 길이 단위 1야드는 1m보다 조금 길다.","1야드는 약 91cm로 1m보다 조금 짧아요."],
[15,3,1,"미국에서 쓰는 화씨온도 32도는 섭씨 0도와 같다.","물이 끓는 섭씨 100도는 화씨로 212도예요."],
[15,3,1,"밤에 다니는 배는 앞쪽을 보고 왼편에 빨간 불, 오른편에 초록 불을 켠다.","비행기 날개 끝에도 같은 규칙으로 빨간 불과 초록 불을 달아요."],
[0,1,0,"번개는 같은 곳에 두 번 떨어지지 않는다.","엠파이어 스테이트 빌딩은 한 해에 20번 넘게 번개를 맞아요."],
[0,2,1,"다이아몬드와 연필심은 같은 원소로 되어 있다.","둘 다 탄소예요. 원자가 늘어선 모양만 달라요."],
[2,2,1,"갓난아기는 어른보다 뼈가 많다.","아기는 270~300개쯤인데 자라면서 붙어 어른은 206개가 돼요."],
[2,2,0,"혀는 부위마다 느끼는 맛이 정해져 있다.","'혀 지도'는 잘못 퍼진 얘기예요. 혀 어디서나 모든 맛을 느껴요."],
[4,1,1,"문어는 심장이 3개다.","온몸에 피를 보내는 심장 하나, 아가미 쪽에 둘이 있어요."],
[4,1,0,"북극에도 펭귄이 산다.","펭귄은 남반구에만 살아요. 북극엔 북극곰이 있어요."],
[1,2,0,"태양계에서 가장 뜨거운 행성은 수성이다.","두꺼운 대기에 열이 갇힌 금성이 더 뜨거워요."],
[1,3,1,"금성은 한 바퀴 자전하는 데 공전보다 오래 걸린다.","자전은 약 243일, 공전은 약 225일 걸려요."],
[1,1,0,"만리장성은 달에서 맨눈으로 보인다.","폭이 좁아서 달은커녕 우주 정거장에서도 맨눈으론 거의 안 보여요."],
[8,2,0,"한글날은 훈민정음을 만든 날을 기념한다.","만든 해는 1443년이고, 한글날은 1446년 반포를 기념해요."],

  }
  watch() {
    this.finishMe();
    this.banner.hidden = true; this.banner.classList.remove('in');
    this.watching = true; this.state = 'play'; this.root.dataset.state = 'watch';
    this.btns.hidden = true; this.hintBtn.hidden = true; this.watchbar.hidden = false;
    this.next(this.lastWrong);
  }
  /* 기록, 도토리 : 내가 탈출하거나 끝내 빠진 순간 한 번 */
  finishMe() {
    if (this.recorded) return; this.recorded = true;
    const escaped = this.meEscaped;
    if (this.mode === 'tower') {
      const t = store.get('lulupia-tower', { games: 0, best: 0, score: 0 }), floors = this.fellFloor || this.floor();
      this.newBest = t.games > 0 && floors > t.best;
      t.games++; t.best = Math.max(t.best, floors); t.score = Math.max(t.score, this.score); store.set('lulupia-tower', t);
    } else if (this.mode === 'free') {
      const rec = store.get('lulupia-rec', { games: 0, escapes: 0, best: -1, right: 0, asked: 0 }), cleared = escaped ? ROUNDS : this.fellAt;
      this.newBest = rec.games > 0 && cleared > rec.best;
      rec.games++; if (escaped) rec.escapes++; rec.best = Math.max(rec.best, cleared); rec.right += this.correct; rec.asked += this.answered;
      store.set('lulupia-rec', rec);
    }
    const bs = store.get('lulupia-best', {});
    if (bs[this.mode] != null && this.score > bs[this.mode]) this.newBest = true;
    bs[this.mode] = Math.max(bs[this.mode] || 0, this.score); store.set('lulupia-best', bs);
    let earn = Math.round(this.score / 100) + (escaped ? 5 : 0);
    if (this.mode === 'tower') earn += Math.floor(((this.fellFloor || this.floor()) - 1) / 10) * 5;
    if (this.dailyFirst) { earn += 3; this.dailyLine = this.shareLine(); store.set('lulupia-daily', { date: today(), line: this.dailyLine, res: escaped ? '탈출' : `${this.fellAt + 1}단` }); }
    this.earned = earn; Wallet.add(earn);
  }
  shareLine() {
    const marks = this.log.filter(l => !l.revive).map(l => (l.pick == null ? '⚪' : l.pick === l.a ? '🟢' : '🔴'));
    while (marks.length < ROUNDS) marks.push('⚪');
    const res = this.meEscaped ? '탈출 성공!' : `${this.fellAt + 1}단에서 퐁당`;
    return `루루피아 오늘의 10문제 · ${todayLabel()}\n${marks.slice(0, ROUNDS).join('')}\n${res} · ${fmt(this.score)}점\n${PUBLIC_URL}`;
  }
  showResult() {
    if (!this.result.hidden) return;
    this.finishMe();
    this.token++; clearInterval(this.ticker); clearTimeout(this.endT);
    this.banner.hidden = true; this.watchbar.hidden = true; this.btns.hidden = true; this.hintBtn.hidden = true;
    this.state = 'over'; this.root.dataset.state = 'over';
    const won = this.meEscaped, card = this.result.querySelector('.r-card'), tower = this.mode === 'tower';
    card.dataset.k = won ? 'win' : 'fail';
    card.querySelector('.r-title').textContent = won ? '탈출 성공!' : tower ? `${this.fellFloor}층에서 퐁당!` : `${this.fellAt + 1}단에서 퐁당!`;
    const hero = card.querySelector('.r-hero svg'); hero.innerHTML = rivalArt({ ...myLook(), id: 'hero' + (++this.artSeq) }); hero.dataset.face = won ? 'laugh' : 'cry';
    card.querySelector('.r-new').hidden = !this.newBest;
    card.querySelector('.r-acorn b').textContent = `도토리 +${this.earned}`;
    card.querySelector('.rs1').textContent = `${this.correct}/${this.answered}`;
    card.querySelector('.rs2').textContent = won ? '탈출' : tower ? `${this.fellFloor}층` : `${this.fellAt + 1}단`;
    card.querySelector('.rs2l').textContent = tower ? '올라간 층' : '올라간 높이';
    card.querySelector('.rs3').textContent = fmt(this.score);
    const done = this.level >= ROUNDS, left = this.slimes.filter(s => !s.me && s.alive).length;
    const note = [];
    if (this.maxStreak >= 3) note.push(`최고 ${this.maxStreak}연속 정답`);
    if (!tower) note.push(done ? `탈출한 친구 ${this.escaped || 0}마리` : `남은 친구 ${left}마리`);
    if (this.mode === 'daily' && !this.dailyFirst) note.push('오늘 기록은 첫 판만 남아요');
    const nt = card.querySelector('.r-note'); nt.textContent = note.join(' · '); nt.hidden = !note.length;
    const sh = card.querySelector('.r-share');
    sh.hidden = this.mode !== 'daily';
    if (this.mode === 'daily') {
      this.shareText = this.dailyFirst ? this.dailyLine : ((store.get('lulupia-daily', null) || {}).line || this.shareLine());
      sh.querySelector('pre').textContent = this.shareText;
      sh.querySelector('[data-act="share"]').hidden = !navigator.share;
      sh.querySelector('[data-act="copy"]').textContent = '결과 복사';
    }
    card.querySelector('ol').innerHTML = this.log.map(l => {
      const miss = l.pick && l.pick !== l.a;
      return `<li class="${miss ? 'miss' : ''}"><span class="mk ${l.a.toLowerCase()}" aria-label="정답 ${l.a}"><i class="glyph ${l.a.toLowerCase()}"></i></span><div><p>${l.revive ? '<em class="rv">패자부활전</em> ' : ''}${l.q}</p><small>${miss ? `<em>내 답 ${l.pick}</em> · ` : ''}${l.e}</small></div></li>`;
    }).join('');
    card.querySelector('details').open = !won && this.mode !== 'daily';
    this.result.hidden = false; card.scrollTop = 0;
    this.hud();
    if (won) Sfx.play('saved');
  }
  async copyShare() {
    const btn = this.result.querySelector('[data-act="copy"]');
    try { await navigator.clipboard.writeText(this.shareText); btn.textContent = '복사했어요!'; }
    catch (e) {
      const pre = this.result.querySelector('.r-share pre'), r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = '글을 눌러 복사해 주세요';
    }
  }
  async shareResult() { if (!navigator.share) return this.copyShare(); try { await navigator.share({ text: this.shareText }); } catch (e) {} }
  closePanel() {
    if (!this.closetEl.hidden) { this.closetEl.hidden = true; this.refreshMe(); }
    this.dexEl.hidden = true;
    this.hud();
  }
  refreshMe() {
    if (!this.me || this.state !== 'title') return;
    this.me.r = myLook(); this.me.svg.innerHTML = rivalArt(this.me.r);
  }
  /* ---------- 꾸미기 창 ---------- */
  openCloset() { if (this.state !== 'title') return; this.clTab = this.clTab || 'hat'; this.clSel = null; this.clMsg = ''; this.renderCloset(); this.closetEl.hidden = false; }
  overFor(kind, key) {
    if (kind === 'hat') return { hat: key };
    if (kind === 'color') return { color: key };
    const d = SHOP.deco.find(x => x[0] === key);
    return d[3] === 'back' ? { back: key } : { [d[3]]: true };
  }
  wearing(c, kind, key) {
    if (kind === 'hat') return c.hat === key;
    if (kind === 'color') return c.color === key;
    const d = SHOP.deco.find(x => x[0] === key);
    return d[3] === 'back' ? c.back === key : !!c[d[3]];
  }
  renderCloset() {
    const c = Closet.get(), acorn = Wallet.get(), bag = Bag.get(), sel = this.clSel, tab = this.clTab;
    const prev = lookOf(c, sel ? this.overFor(sel.kind, sel.key) : {});
    this.closetEl.querySelector('.acn2').textContent = fmt(acorn);
    const art = (look) => `<svg class="pt npc" viewBox="0 0 100 100" aria-hidden="true">${rivalArt({ ...look, id: 'cl' + (++this.artSeq) })}</svg>`;
    let grid = '';
    if (tab === 'tool') {
      grid = `<div class="tools">${TOOLS.map(([key, name, price, max, icon, desc]) => `<div class="tool"><span class="t-ic">${icon}</span><div class="t-tx"><b>${name} <small>가진 것 ${bag[key]}개</small></b><span>${desc}</span></div><button class="cta${acorn < price || bag[key] >= max ? ' off' : ''}" type="button" data-buytool="${key}">${ACORN}${price}</button></div>`).join('')}</div>`;
    } else {
      grid = `<div class="items">${SHOP[tab].map(([key, name, price]) => {
        const own = owns(c, tab, key), on = this.wearing(c, tab, key), picked = sel && sel.kind === tab && sel.key === key;
        const look = lookOf(c, this.overFor(tab, key));
        return `<button class="item${on ? ' on' : ''}${picked ? ' picked' : ''}" type="button" data-kind="${tab}" data-key="${key}">${art(look)}<b>${name}</b><small>${on ? '입는 중' : own ? '가진 것' : `${ACORN}${price}`}</small></button>`;
      }).join('')}</div>`;
    }
    let bar = '';
    if (sel) {
      const item = SHOP[sel.kind].find(x => x[0] === sel.key), price = item[2];
      bar = acorn >= price ? `<div class="buybar"><span>${item[1]} · 도토리 ${price}개로 살까요?</span><button class="cta" type="button" data-buy="1">사기</button></div>` : `<div class="buybar poor"><span>${item[1]} · 도토리가 ${price - acorn}개 모자라요</span></div>`;
    } else if (this.clMsg) bar = `<div class="buybar ok"><span>${this.clMsg}</span></div>`;
    this.closetEl.querySelector('.p-body').innerHTML = `<div class="cl-top"><div class="cl-hero">${art(prev).replace('class="pt npc"', 'class="pt npc" data-face="laugh"')}</div>
      <div class="tabs" role="tablist">${[['hat', '모자'], ['color', '색'], ['deco', '장식'], ['tool', '도구']].map(([k, l]) => `<button class="tab" type="button" role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}</button>`).join('')}</div></div>
      ${grid}${bar}`;
  }
  closetClick(e) {
    const t = e.target.closest('[data-tab],[data-kind],[data-buy],[data-buytool]'); if (!t) return;
    const c = Closet.get();
    if (t.dataset.tab) { this.clTab = t.dataset.tab; this.clSel = null; this.clMsg = ''; }
    else if (t.dataset.buytool) {
      const [key, name, price, max] = TOOLS.find(x => x[0] === t.dataset.buytool), bag = Bag.get();
      if (Wallet.get() >= price && bag[key] < max) { Wallet.add(-price); bag[key]++; Bag.set(bag); Sfx.play('saved'); }
      else Sfx.play('buzz');
    } else if (t.dataset.buy) {
      const { kind, key } = this.clSel, item = SHOP[kind].find(x => x[0] === key);
      if (Wallet.get() < item[2]) return;
      Wallet.add(-item[2]); c.owned.push(`${kind}:${key}`); this.equip(c, kind, key); Closet.set(c);
      this.clSel = null; this.clMsg = `${item[1]}을(를) 샀어요!`; Sfx.play('fanfare');
    } else {
      const kind = t.dataset.kind, key = t.dataset.key;
      if (owns(c, kind, key)) { this.equip(c, kind, key); Closet.set(c); this.clSel = null; this.clMsg = ''; Sfx.play('hop'); }
      else { this.clSel = { kind, key }; this.clMsg = ''; Sfx.play('hop'); }
    }
    const scroll = this.closetEl.querySelector('.p-body').scrollTop;
    this.renderCloset(); this.closetEl.querySelector('.p-body').scrollTop = scroll;
    this.hud();
  }
  equip(c, kind, key) {
    if (kind === 'hat') c.hat = key;
    else if (kind === 'color') c.color = key;
    else { const d = SHOP.deco.find(x => x[0] === key); if (d[3] === 'back') c.back = c.back === key ? null : key; else c[d[3]] = !c[d[3]]; }
  }
  /* ---------- 문제 도감 ---------- */
  openDex() { if (this.state !== 'title') return; this.dexCat = null; this.renderDex(); this.dexEl.hidden = false; }
  renderDex() {
    const d = Dex.get(), body = this.dexEl.querySelector('.p-body');
    const idxOf = ci => QS.map((q, i) => (q[0] === ci ? i : -1)).filter(i => i >= 0);
    if (this.dexCat == null) {
      body.innerHTML = `<p class="dx-sum">맞힌 문제 <b>${d.r.size}</b> / ${QS.length}<span>본 문제 ${d.s.size}개</span></p><div class="dx-grid">${CATS.map((c, ci) => {
        const idx = idxOf(ci), r = idx.filter(i => d.r.has(i)).length, pct = Math.round(r / idx.length * 100);
        return `<button class="dx-cat${pct === 100 ? ' full' : ''}" type="button" data-cat="${ci}"><b>${c}</b><span class="dx-bar"><i style="width:${pct}%"></i></span><small>${r} / ${idx.length}${pct === 100 ? ' · 정복!' : ''}</small></button>`;
      }).join('')}</div>`;
    } else {
      const ci = this.dexCat, idx = idxOf(ci), rights = idx.filter(i => d.r.has(i)), wrongs = idx.filter(i => d.s.has(i) && !d.r.has(i)), unseen = idx.length - rights.length - wrongs.length;
      const item = (i, ok) => { const [, , a, q, e] = QS[i], A = a ? 'O' : 'X'; return ok ? `<li><span class="mk ${A.toLowerCase()}"><i class="glyph ${A.toLowerCase()}"></i></span><div><p>${q}</p><small>${e}</small></div></li>` : `<li class="miss"><span class="mk q">?</span><div><p>${q}</p><small>아직 못 맞혔어요</small></div></li>`; };
      body.innerHTML = `<button class="dx-back" type="button" data-dexback="1">← 분야 목록</button><h3 class="dx-title">${CATS[ci]} <small>${rights.length} / ${idx.length}</small></h3><ol class="dx-list">${rights.map(i => item(i, true)).join('')}${wrongs.map(i => item(i, false)).join('')}</ol>${unseen ? `<p class="dx-unseen">아직 못 본 문제 ${unseen}개</p>` : ''}`;
    }
    body.scrollTop = 0;
  }
  dexClick(e) {
    const t = e.target.closest('[data-cat],[data-dexback]'); if (!t) return;
    this.dexCat = t.dataset.dexback ? null : +t.dataset.cat; Sfx.play('hop'); this.renderDex();
  }
}

const game = new Game(document.getElementById('game'));
if (window.__LULU_TEST) window.__lulu = game;
})();
</script>
