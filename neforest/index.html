<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네포레스트</title>
<meta name="description" content="슬라임들이 사는 숲. 주사위 대결 티티카카, 숲속 OX 대탈출 루루피아, 도토리로 꾸미는 옷장.">
<meta property="og:type" content="website">
<meta property="og:title" content="네포레스트 - 슬라임들이 사는 숲">
<meta property="og:description" content="주사위 대결, 숲속 OX 대탈출, 도토리로 꾸미는 내 슬라임.">
<meta property="og:url" content="https://remontant.github.io/titicaca-dice/neforest/">
<meta property="og:image" content="https://remontant.github.io/titicaca-dice/neforest/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gothic+A1:wght@500;700;800&display=swap">
<style>
:root{
  --u:clamp(1.75px,calc((100vw - 32px) / 161),2.6px);
  --ink:#3B2F4A; --ink-soft:#6E6380; --mint:#7FE3C8; --leaf:#4CC26B; --leaf-deep:#2E8F4A; --cream:#FFF9EC;
  --ui:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#8FD07A;color:var(--ink);font:500 15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #FFB21E;outline-offset:3px}
.defs{position:absolute;width:0;height:0}

/* 숲 : 하늘 · 먼 나무 · 풀밭 그림 위에 머리 줄, 내 슬라임, 갈 곳 카드 */
.nf{position:relative;min-height:100dvh;overflow:hidden;padding-bottom:max(28px,env(safe-area-inset-bottom,0px))}
.nf-bg{position:absolute;inset:0;z-index:0;width:100%;height:100%}
.nf-in{position:relative;z-index:1;width:min(980px,100%);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nf-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-top:max(14px,env(safe-area-inset-top,0px))}
.record{justify-self:start;display:flex;align-items:center;gap:5px;margin:0;padding:5px 14px 5px 6px;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 2px #A6DDB0,0 3px 0 #7FC08C,0 4px 8px rgba(40,110,60,.18);font:400 17px/1.2 var(--display)}
.record svg{width:24px;height:24px}
.record b{font-weight:400}
.nf-logo{margin:0;justify-self:center;width:min(250px,52vw);line-height:0}
.nf-logo svg{width:100%;height:auto;overflow:visible}
.nf-logo text{font-family:var(--display)}

.nf-glade{position:relative;display:grid;justify-items:center;padding:18px 0 8px}
.nf-me{position:relative;width:170px;height:170px}
.nf-me .pt{width:100%;height:100%;overflow:visible;cursor:pointer;filter:drop-shadow(0 6px 0 rgba(40,110,60,.18))}
.nf-me .cl-btn{left:-6px;top:6px}
.nf-say{position:absolute;left:calc(50% + 62px);top:4px;width:max-content;max-width:min(160px,calc(50vw - 30px));margin:0;padding:8px 12px 9px;border-radius:16px 16px 16px 4px;background:#fff;box-shadow:0 3px 0 #CDE9D5,0 6px 14px rgba(30,80,45,.15);font:400 15px/1.3 var(--display);color:var(--leaf-deep);white-space:normal;word-break:keep-all;animation:say-in .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes say-in{0%{opacity:0;transform:scale(.4) translateY(10px)}100%{opacity:1;transform:none}}
.nf-tag{margin-top:-6px;display:flex;align-items:center;gap:8px;padding:6px 18px 7px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2.5px var(--mint),0 4px 0 #5CC4A8;font:400 20px/1.1 var(--display)}
.nf-tag small{font:700 12px/1 var(--ui);color:var(--ink-soft)}

.nf-places{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}
@media (min-width:760px){.nf-places{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.nf-me{width:200px;height:200px}.nf-say{left:calc(50% + 86px)}}
.place{--rim:#A6DDB0;--edge:#7FC08C;--tint:#F1FAF3;position:relative;display:grid;align-content:start;gap:3px;min-width:0;padding:10px 12px 14px;border:0;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 3px var(--rim),0 6px 0 var(--edge),0 10px 18px rgba(30,80,45,.18);color:var(--ink);text-align:left;text-decoration:none;cursor:pointer;transition:translate .12s}
.place:hover{translate:0 -3px}
.place:active{translate:0 3px;box-shadow:inset 0 0 0 3px var(--rim),0 2px 0 var(--edge),0 4px 10px rgba(30,80,45,.18)}
.place .art{display:block;width:100%;aspect-ratio:4/3;margin-bottom:4px;border-radius:14px;background:var(--tint);overflow:hidden}
.place .art svg{width:100%;height:100%;display:block}
.place b{font:400 clamp(18px,4.6vw,22px)/1.15 var(--display)}
.place span{font-size:13px;line-height:1.35;color:var(--ink-soft);word-break:keep-all}
.place small{justify-self:start;margin-top:6px;padding:3px 10px 4px;border-radius:99px;background:var(--tint);color:var(--ink);font:700 12px/1.3 var(--ui);word-break:keep-all}
.place.dice{--rim:#F5C46A;--edge:#D9900F;--tint:#FFF6E0}
.place.ox{--rim:#8FD8E8;--edge:#3FA7C4;--tint:#EAF8FC}
.place.closet{--rim:#FFB3CF;--edge:#E07FA6;--tint:#FFF0F6}
.place.dex{--rim:#C9B6F2;--edge:#8C70D6;--tint:#F5F0FF}
.place .go{position:absolute;right:12px;top:12px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 0 var(--edge);color:var(--edge);font:400 18px/1 var(--display)}
.nf-foot{margin:26px auto 0;max-width:34em;text-align:center;font-size:12.5px;line-height:1.55;color:#2F5E3A;text-wrap:balance;word-break:keep-all}

/* 주민 게시판 */
#dex{width:min(640px,calc(100vw - 32px))}
.dex-sum{margin:-6px 0 0;color:var(--ink-soft);font-size:.92em}
.dex-star{display:grid;gap:8px}
.dex-star h3{margin:0;display:flex;align-items:center;gap:6px;font:400 17px/1 var(--display);color:#B07A10}
.dex-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dex-card{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;padding:8px 10px 9px 6px;border-radius:16px;background:#F6F2FF;box-shadow:inset 0 0 0 2px #E2D8F8}
.dex-card svg{width:52px;height:52px;overflow:visible}
.dex-card b{display:block;font:400 15px/1.2 var(--display)}
.dex-card i{display:block;font-style:normal;font-size:12px;line-height:1.35;color:var(--ink-soft);word-break:keep-all}
.dex-card em{display:inline-block;margin-top:3px;padding:1px 7px 2px;border-radius:99px;background:#fff;font:800 11px/1.4 var(--ui);font-style:normal;color:#6A50B8}
.dex-card.new{background:#FAFAFA;box-shadow:inset 0 0 0 2px #EBEBEB}
.dex-card.new svg{filter:grayscale(.7) brightness(1.05);opacity:.55}
.dex-card.new em{color:#9A93A6}
@media (prefers-reduced-motion:reduce){.nf-say,.place{animation:none;transition:none}}

.pt .nb,.pt .sb{transform-box:fill-box;transform-origin:50% 100%}
.pt .sb{animation:boing 2.4s ease-in-out infinite}
.pt .sh{transform-box:fill-box;transform-origin:50% 50%;animation:shade 2.4s ease-in-out infinite}
.pt .lid{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);animation:blink 4.2s infinite}
.pt .prop{transform-box:fill-box;transform-origin:50% 50%;animation:spin 2.4s linear infinite}
.pt .flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .55s ease-in-out infinite alternate}
.pt .glowtip{animation:glowp 1.6s ease-in-out infinite}
.pt .e-happy,.pt .e-shock,.pt .e-cry,.pt .m-open,.pt .m-shock,.pt .m-cry,.pt .b-scowl,.pt .tears{display:none}
.npc[data-face="grin"] .e-idle,.npc[data-face="laugh"] .e-idle,.npc[data-face="shock"] .e-idle,.npc[data-face="cry"] .e-idle{display:none}
.npc[data-face="grin"] .e-happy,.npc[data-face="laugh"] .e-happy,.npc[data-face="shock"] .e-shock,.npc[data-face="cry"] .e-cry,.npc[data-face="cry"] .tears,.npc[data-face="scowl"] .b-scowl{display:inline}
.npc[data-face="scowl"] .b-idle{display:none}
.npc[data-face="grin"] .m-closed,.npc[data-face="laugh"] .m-closed,.npc[data-face="shock"] .m-closed,.npc[data-face="cry"] .m-closed{display:none}
.npc[data-face="grin"] .m-open,.npc[data-face="laugh"] .m-open,.npc[data-face="shock"] .m-shock,.npc[data-face="cry"] .m-cry{display:inline}
.npc[data-face="think"] .pupil{transform:translateX(2.6px)}
.npc[data-face="think"] .nb{animation:n-think 1s ease-in-out infinite}
.npc[data-face="grin"] .nb,.npc[data-face="laugh"] .nb{animation:n-laugh .7s ease-out}
.npc[data-face="shock"] .nb{animation:n-jump .9s ease-out}
.npc[data-face="scowl"] .nb{animation:n-scowl .55s ease-in-out}
.npc[data-face="cry"] .nb{animation:n-cry .5s both ease-in}
.npc[data-face="cry"] .tears{animation:n-tear .7s ease-in infinite}
.bet{--top:#FFE27A;--bot:#FFB21E;--edge:#C7780A;--o:#8A4F0E;position:relative;isolation:isolate;height:calc(var(--u)*18);padding:0 calc(var(--u)*6);border-radius:calc(var(--u)*6);background:linear-gradient(var(--top),var(--bot));color:#fff;font:400 max(13px,calc(var(--u)*6.8))/1 var(--display);box-shadow:inset 0 0 0 calc(var(--u)*.9) rgba(255,255,255,.65),0 calc(var(--u)*2) 0 var(--edge),0 calc(var(--u)*3.4) calc(var(--u)*4.6) rgba(40,90,50,.26);cursor:pointer;white-space:nowrap;transition:translate .08s,box-shadow .08s}
.bet::before{content:"";position:absolute;z-index:-1;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(var(--u)*1.6);height:calc(var(--u)*3.8);border-radius:99px;background:rgba(255,255,255,.5)}
.bet:active:enabled{translate:0 calc(var(--u)*1.4);box-shadow:inset 0 0 0 calc(var(--u)*.9) rgba(255,255,255,.65),0 calc(var(--u)*.6) 0 var(--edge)}
.bet:disabled{cursor:not-allowed;opacity:.55;filter:saturate(.4)}
.cl-wins svg{width:1.3em;height:1.3em;margin-right:.2em;vertical-align:-.3em}
.cl-help{margin:calc(var(--u)*-1) 0 0;font-size:.82em;color:#7A8F80;text-align:center}
.cl-item small svg{width:1.15em;height:1.15em;margin-right:.1em;vertical-align:-.25em}
.cl-wins svg,.cl-item small svg,.hello em svg{display:inline-block}
.cl-bar.buy{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*3);background:#FFF6E2;color:#7A4A1E}
.cl-buy{flex:none;padding:calc(var(--u)*2.2) calc(var(--u)*6);border:0;border-radius:99px;background:linear-gradient(#FFE27A,#F5A623);color:#fff;font:400 max(14px,calc(var(--u)*6.2))/1 var(--display);text-shadow:0 1px 0 #B8461A;box-shadow:inset 0 0 0 calc(var(--u)*.8) rgba(255,255,255,.7),0 calc(var(--u)*1.2) 0 #C2700A;cursor:pointer}
.cl-buy:focus-visible{outline:calc(var(--u)*1.2) solid #FFB21E;outline-offset:calc(var(--u)*1)}
.hello{position:fixed;z-index:30;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);translate:-50% 0;display:grid;gap:6px;width:min(360px,calc(100vw - 32px));padding:14px 18px 12px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2px #F0C77A,0 4px 0 #E0A84A,0 10px 28px rgba(60,40,10,.25);color:var(--ink);font:500 14px/1.5 var(--ui);cursor:pointer;animation:hello-in .5s cubic-bezier(.3,1.5,.5,1)}
.hello b{display:flex;align-items:center;gap:6px;font:400 17px/1.2 var(--display);color:#7A4508}
.hello svg{width:22px;height:22px;flex:none}
.hello em{font-style:normal;font-weight:800;color:#3F5373;white-space:nowrap}
.hello em svg{width:17px;height:17px;margin-right:2px;vertical-align:-4px}
.hello small{justify-self:end;color:#A08A6A;font-size:12px}
.hello.out{animation:hello-out .3s ease-in forwards}
@keyframes hello-in{0%{opacity:0;transform:translateY(-30px) scale(.9)}100%{opacity:1;transform:none}}
@keyframes hello-out{to{opacity:0;transform:translateY(-20px)}}
@media (prefers-reduced-motion:reduce){.hello,.hello.out{animation:none}}
dialog{width:min(calc(var(--u)*196),calc(100vw - 32px));max-height:calc(100dvh - 32px);padding:calc(var(--u)*9);border:0;border-radius:calc(var(--u)*8);background:#fff;color:var(--ink);box-shadow:inset 0 0 0 calc(var(--u)*1.2) var(--mint),0 calc(var(--u)*6) calc(var(--u)*16) rgba(30,80,45,.35)}
dialog::backdrop{background:rgba(30,70,45,.5)}
.rules{display:grid;gap:calc(var(--u)*6)}
.rules h2{margin:0;font:400 1.5em/1.1 var(--display);color:var(--leaf-deep);outline:none}
.rules ul{display:grid;gap:calc(var(--u)*5);margin:0;padding:0 0 0 1.1em;font-weight:500}
.rules li{line-height:1.45}
.rules li::marker{color:var(--leaf)}
@keyframes boing{0%,62%,100%{transform:none}70%{transform:scale(1.08,.9)}78%{transform:translateY(-12px) scale(.94,1.08)}86%{transform:translateY(0) scale(1.1,.88)}93%{transform:scale(.97,1.04)}}
@keyframes shade{0%,62%,100%{transform:none}78%{transform:scale(.72);opacity:.6}86%{transform:scale(1.1)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glowp{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes n-think{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(1px)}}
@keyframes n-laugh{0%,100%{transform:none}25%{transform:translateY(-14px) scale(.92,1.1)}50%{transform:scale(1.1,.9)}75%{transform:translateY(-5px) scale(.97,1.04)}}
@keyframes n-jump{0%{transform:none}15%{transform:scale(1.25,.72)}35%{transform:translateY(-20px) scale(.82,1.2)}55%{transform:scale(1.12,.9) rotate(-5deg)}75%{transform:scale(.96,1.04) rotate(4deg)}100%{transform:none}}
@keyframes n-scowl{0%,100%{transform:none}30%{transform:scale(1.06,.95)}45%{transform:scale(1.06,.95) rotate(-4deg)}60%{transform:scale(1.06,.95) rotate(4deg)}}
@keyframes n-cry{to{transform:translateY(2px) scale(1.08,.88)}}
@keyframes n-tear{from{transform:translateY(-1px);opacity:1}to{transform:translateY(16px);opacity:0}}
@keyframes flick{from{transform:none}to{transform:scale(1.05,.9) skewX(-3deg)}}
.cl-btn{position:absolute;left:calc(var(--u)*2);top:calc(var(--u)*1);z-index:2;display:grid;place-items:center;width:calc(var(--u)*13);height:calc(var(--u)*13);padding:0;border:0;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 calc(var(--u)*1) #A6DDB0,0 calc(var(--u)*.9) 0 #7FC08C;cursor:pointer}
.cl-btn svg{width:62%;height:62%}
.cl-btn.new::after{content:"";position:absolute;right:calc(var(--u)*-.6);top:calc(var(--u)*-.6);width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);border-radius:50%;background:#FF5D73;box-shadow:0 0 0 calc(var(--u)*.8) #fff}
.cl-btn:focus-visible,.cl-tab:focus-visible,.cl-item:focus-visible{outline:calc(var(--u)*1.2) solid #FFB21E;outline-offset:calc(var(--u)*1)}
#closet{width:min(calc(var(--u)*236),calc(100vw - 32px));overflow-y:auto;overscroll-behavior:contain}
.closet-box{gap:calc(var(--u)*5)}
#closetBody{display:grid;gap:calc(var(--u)*5)}
.cl-top{display:grid;justify-items:center;gap:calc(var(--u)*2)}
.cl-hero{width:calc(var(--u)*50);height:calc(var(--u)*50)}
.cl-hero svg{width:100%;height:100%;overflow:visible}
.cl-wins{margin:0;font-size:.92em;color:#5B7A66;text-align:center}
.cl-wins b{font:400 1.25em var(--display);color:var(--leaf-deep)}
.cl-tabs{display:flex;justify-content:center;gap:calc(var(--u)*2);padding:calc(var(--u)*1.6);border-radius:99px;background:#EAF7EE;justify-self:center}
.cl-tab{font:400 max(14px,calc(var(--u)*6.4))/1 var(--display);padding:calc(var(--u)*2.8) calc(var(--u)*7);border:0;border-radius:99px;background:transparent;color:#5B7A66;cursor:pointer}
.cl-tab[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 calc(var(--u)*.8) 0 #A6DDB0}
.cl-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(var(--u)*42),1fr));gap:calc(var(--u)*3)}
.cl-item{display:grid;justify-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*2.6) calc(var(--u)*1.4) calc(var(--u)*3);border:calc(var(--u)*1) solid transparent;border-radius:calc(var(--u)*6);background:#F3FBF5;color:var(--ink);font:inherit;cursor:pointer}
.cl-item svg{width:calc(var(--u)*28);height:calc(var(--u)*28);overflow:visible}
.cl-item b{font:400 max(13px,calc(var(--u)*5.6))/1.15 var(--display);text-align:center;word-break:keep-all}
.cl-item small{font-size:max(12px,calc(var(--u)*5));color:#5B7A66}
.cl-item.on{border-color:#FFB428;background:#FFF6D6}
.cl-item.picked{border-color:#E07FA6;background:#FFF0F6}
.cl-item.locked svg{filter:grayscale(.65);opacity:.6}
.cl-item.locked small{color:#C95F78}
.cl-bar{margin:0;padding:calc(var(--u)*3.4) calc(var(--u)*5);border-radius:calc(var(--u)*5);background:#FFF0F6;color:#8A3A58;font-weight:500;line-height:1.45}
.cl-bar.ok{background:#EAF7EE;color:#2E7A44}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true"><defs><radialGradient id="cloverG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#B8F59A"/><stop offset="1" stop-color="#3FAE52"/></radialGradient><linearGradient id="logoG" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="#FFFBD1"/><stop offset=".55" stop-color="#FFD23F"/><stop offset="1" stop-color="#FF9F1C"/></linearGradient><linearGradient id="vsG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6B0"/><stop offset="1" stop-color="#FFB21E"/></linearGradient><linearGradient id="crownG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3A0"/><stop offset="1" stop-color="#E9A21E"/></linearGradient></defs></svg>
<div class="hello" id="hello" role="status" hidden></div>
<main class="nf">
  <svg class="nf-bg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true"><defs>
<linearGradient id="nfSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ED8FF"/><stop offset=".22" stop-color="#C9F0FF"/><stop offset=".24" stop-color="#A9E58C"/><stop offset=".55" stop-color="#93D57C"/><stop offset="1" stop-color="#7CC468"/></linearGradient>
<radialGradient id="nfSun" cx=".08" cy=".02" r=".35"><stop offset="0" stop-color="#FFFBE0" stop-opacity=".95"/><stop offset="1" stop-color="#FFFBE0" stop-opacity="0"/></radialGradient>

  }

  const ACORN = '<svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="25" rx="11" ry="12" fill="#D08A45" stroke="#8A5424" stroke-width="1.6"/><ellipse cx="16" cy="22" rx="3" ry="5" fill="#E9B072" opacity=".8"/><path d="M6 16c2-9 26-9 28 0-4 3-24 3-28 0z" fill="#7B4A26" stroke="#5A3418" stroke-width="1.4"/><path d="M10 13l20 4M12 18l6-7M20 18l6-7M26 18l4-5" stroke="#5A3418" stroke-width="1.4"/><path d="M20 8l1-5" stroke="#5A3418" stroke-width="2.6" stroke-linecap="round"/></svg>';
  const PEBBLE = '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5.5 25.5c-1-8.5 6.5-14 15.5-14s14.5 5 13.5 12.5-7.5 10.5-15.5 10.5S6.5 32 5.5 25.5z" fill="#AFC2DA" stroke="#5B6F8F" stroke-width="1.8"/><ellipse cx="25" cy="27.5" rx="7" ry="3.4" fill="#93A8C6" opacity=".6"/><path d="M10 23.5c1.2-5 6-8 12-8" fill="none" stroke="#F1F6FC" stroke-width="2.6" stroke-linecap="round"/><path d="M31.5 5l1 2.6 2.6 1-2.6 1-1 2.6-1-2.6-2.6-1 2.6-1z" fill="#FFF3B0" stroke="#E0A84A" stroke-width=".9" stroke-linejoin="round"/></svg>';
  function acorns(add = 0) {
    let v = 0;
    try { v = Math.max(0, Math.floor(+JSON.parse(localStorage.getItem('lulupia-acorn')) || 0)); } catch {}
    if (add) { v = Math.max(0, v + add); try { localStorage.setItem('lulupia-acorn', JSON.stringify(v)); } catch {} }
    return v;
  }
  function paintRecord() {
    $('#record').innerHTML = `${ACORN}<b>${acorns().toLocaleString('ko-KR')}</b>`;
    paintPlaces();
  }
  /* 꾸미기 : 루루피아와 같은 아이템 목록(SHOP). 네포레스트 도토리로 사거나, 이긴 횟수로 열린다(값 ÷ 5 승).
     입은 모습은 slime-closet 에 두어서 같은 주소의 루루피아와 함께 쓴다. 거기서 산 것도 여기서 입을 수 있다. */
  const SHOP = {
    hat: [
      ['acorn', '도토리 모자', 0], ['none', '맨머리', 0], ['sprout', '새싹', 20], ['leaf', '나뭇잎', 20], ['berry', '딸기', 30], ['puff', '민들레 솜', 30],
      ['flowers', '꽃 화관', 30], ['nightcap', '수면 모자', 40], ['bug', '더듬이', 40], ['shell', '달팽이 집', 40], ['lily', '연잎', 40], ['mushroom', '빨간 버섯', 50],
      ['pinwheel', '바람개비', 50], ['straw', '밀짚모자', 60], ['scholar', '학사모', 60], ['pinecone', '솔방울', 70], ['helmet', '기사 투구', 70], ['antenna', '반딧불', 80],
      ['wizard', '마법사 모자', 80], ['rainbow', '무지개', 90], ['cloud', '번개 구름', 90], ['frost', '얼음 왕관', 100], ['flame', '불꽃', 100], ['crown', '황금 왕관', 120],
    ],
    color: [
      ['mint', '민트', 0, ['#EFFFF9', '#7FE3C8', '#26A88D'], '#1E8C77'], ['sprout', '연두', 25, ['#F4FFEC', '#A8E890', '#5DBE4E'], '#3E9A3A'],
      ['lavender', '라벤더', 25, ['#F8F4FF', '#C8B6F2', '#8C70D6'], '#6A50B8'], ['milk', '우유', 25, ['#FFFFFF', '#F4ECF4', '#D3BCD3'], '#A584A5'],
      ['strawberry', '딸기 우유', 30, ['#FFF6F8', '#FFCCD6', '#EE8AA0'], '#C95F78'], ['lemon', '레몬', 30, ['#FFFEF0', '#FFF29E', '#EBC93A'], '#BF9B18'],
      ['peach', '살구', 30, ['#FFF6F0', '#FFC6A8', '#F08A64'], '#D0603C'], ['sky', '하늘', 30, ['#F0FBFF', '#9FDDF7', '#3FAEDF'], '#2A8BBE'],
      ['honey', '꿀', 35, ['#FFFBE8', '#FFD45A', '#F0A51E'], '#B97A0C'], ['pink', '분홍', 35, ['#FFF0F6', '#FF9EC4', '#DE4F88'], '#B83A6E'],
      ['tomato', '토마토', 35, ['#FFF1EE', '#FF8F84', '#E2453C'], '#A82A24'], ['grape', '포도', 40, ['#F0F3FF', '#AEBBF5', '#5A6CD2'], '#3E4AA8'],
      ['storm', '먹구름', 40, ['#F2F3FA', '#BAC0DC', '#6C74A6'], '#474F86'], ['frost', '서리', 40, ['#FFFFFF', '#D4F1FF', '#7CC4EC'], '#3F92C8'],
      ['ember', '불씨', 40, ['#FFF4EA', '#FFA266', '#E8572A'], '#B23A14'],
    ],
    deco: [
      ['ears', '토끼 귀', 60, 'back'], ['wings', '꿀벌 날개', 70, 'back'], ['spikes', '고슴도치 가시', 60, 'back'],
      ['stache', '콧수염', 30, 'stache'], ['spots', '무당벌레 점', 40, 'spots'], ['stripes', '꿀벌 줄무늬', 40, 'stripes'],
    ],
  };
  const Closet = {
    get() { let c = {}; try { c = JSON.parse(localStorage.getItem('slime-closet')) || {}; } catch {} return { owned: c.owned || ['hat:acorn', 'hat:none', 'color:mint'], hat: c.hat || 'acorn', color: c.color || 'mint', back: c.back || null, stache: !!c.stache, spots: !!c.spots, stripes: !!c.stripes }; },
    set(c) { try { localStorage.setItem('slime-closet', JSON.stringify(c)); } catch {} },
  };
  const lookOf = (c, over = {}) => {
    const x = { ...c, ...over }, col = SHOP.color.find(k => k[0] === x.color) || SHOP.color[0];
    return { id: 'me', body: col[3], rim: col[4], hat: x.hat, eyes: 'two', mouth: 'cat', brows: 'none', back: x.back || undefined, stache: !!x.stache, spots: !!x.spots, stripes: !!x.stripes };
  };
  Object.assign(ME, lookOf(Closet.get()));
  /* 친구 대결에 보낼 내 모습, 받은 모습은 아는 것만 골라 그린다 */
  const wornLook = () => { const c = Closet.get(); return { hat: c.hat, color: c.color, back: c.back || null, stache: !!c.stache, spots: !!c.spots, stripes: !!c.stripes }; };
  const lookFrom = l => lookOf({ hat: SHOP.hat.some(h => h[0] === l.hat) ? l.hat : 'acorn', color: l.color, back: SHOP.deco.some(d => d[0] === l.back && d[3] === 'back') ? l.back : null, stache: !!l.stache, spots: !!l.spots, stripes: !!l.stripes });
  /* 숲 주민 도감 : 혼자 할 때 만난 판 · 이긴 판을 이름으로 적어 둔다(neforest-dex[이름].dice, 숲 지도에서 본다) */
  function meetRival(res) {
    if (!foe || !foe.name) return;
    let d = {};
    try { d = JSON.parse(localStorage.getItem('neforest-dex')) || {}; } catch {}
    const x = d[foe.name] || {}, s = x.dice || { m: 0, w: 0 };
    s.m++; if (res === 'w') s.w++;
    d[foe.name] = { ...x, dice: s };
    try { localStorage.setItem('neforest-dex', JSON.stringify(d)); } catch {}
  }
  const winsNeed = price => Math.ceil(price / 5);
  const myWins = () => { try { return (JSON.parse(localStorage.getItem('samsepan-record')) || {}).w || 0; } catch { return 0; } };
  const itemOf = (kind, key) => SHOP[kind].find(x => x[0] === key);
  const hasItem = (c, kind, key) => { const it = itemOf(kind, key); return !it[2] || c.owned.includes(`${kind}:${key}`) || myWins() >= winsNeed(it[2]); };
  const overFor = (kind, key) => (kind === 'hat' ? { hat: key } : kind === 'color' ? { color: key } : itemOf('deco', key)[3] === 'back' ? { back: key } : { [itemOf('deco', key)[3]]: true });
  const wearing = (c, kind, key) => (kind === 'hat' ? c.hat === key : kind === 'color' ? c.color === key : itemOf('deco', key)[3] === 'back' ? c.back === key : !!c[itemOf('deco', key)[3]]);
  const unlockedCount = () => { const w = myWins(); return Object.values(SHOP).flat().filter(it => it[2] && w >= winsNeed(it[2])).length; };
  const closetDlg = $('#closet'), closetBody = $('#closetBody');
  let clTab = 'hat', clSel = null, clMsg = '', clSeq = 0;
  function paintClosetDot() {
    let seen = 0; try { seen = +localStorage.getItem('titicaca-closet-seen') || 0; } catch {}
    $('#closetBtn').classList.toggle('new', unlockedCount() > seen);
  }
  function paintMe() { $('#meArt').innerHTML = rivalArt(ME); }
  function renderCloset() {
    const c = Closet.get(), w = myWins(), art = look => `<svg class="pt npc" viewBox="0 0 100 100" aria-hidden="true">${rivalArt({ ...look, id: 'cl' + (++clSeq) })}</svg>`;
    const prev = lookOf(c, clSel ? overFor(clSel.kind, clSel.key) : {});
    const items = SHOP[clTab].map(([key, name, price]) => {
      const own = hasItem(c, clTab, key), on = wearing(c, clTab, key), picked = clSel && clSel.kind === clTab && clSel.key === key;
      return `<button class="cl-item${on ? ' on' : ''}${picked ? ' picked' : ''}${own ? '' : ' locked'}" type="button" data-kind="${clTab}" data-key="${key}">${art(lookOf(c, overFor(clTab, key)))}<b>${name}</b><small>${on ? '입는 중' : own ? '입기' : `${ACORN}${price}`}</small></button>`;
    }).join('');
    let bar = '';
    if (clSel) {
      const it = itemOf(clSel.kind, clSel.key), need = winsNeed(it[2]), have = acorns();
      bar = have >= it[2]
        ? `<div class="cl-bar buy"><span>${it[1]} · 도토리 ${it[2]}개로 살까요?</span><button class="cl-buy" type="button" data-buy="1">사기</button></div>`
        : `<p class="cl-bar">${it[1]} · 도토리가 ${it[2] - have}개 모자라요. ${need}승을 채워도 열려요(지금 ${w}승).</p>`;
    }
    else if (clMsg) bar = `<p class="cl-bar ok">${clMsg}</p>`;
    closetBody.innerHTML = `<div class="cl-top"><div class="cl-hero">${art(prev).replace('class="pt npc"', 'class="pt npc" data-face="laugh"')}</div><p class="cl-wins">${ACORN}도토리 <b>${acorns().toLocaleString('ko-KR')}</b>개 · 이긴 판 <b>${w}</b></p><p class="cl-help">도토리로 사거나, 값의 5분의 1만큼 이기면 열려요</p></div>
      <div class="cl-tabs" role="tablist">${[['hat', '모자'], ['color', '색'], ['deco', '장식']].map(([k, l]) => `<button class="cl-tab" type="button" role="tab" aria-selected="${k === clTab}" data-tab="${k}">${l}</button>`).join('')}</div>
      <div class="cl-items">${items}</div>${bar}`;
  }
  function openCloset() {
    clSel = null; clMsg = '';
    renderCloset();
    try { localStorage.setItem('titicaca-closet-seen', String(unlockedCount())); } catch {}
    paintClosetDot();
    if (!closetDlg.open) closetDlg.showModal();
  }
  closetBody.addEventListener('click', e => {
    const t = e.target.closest('[data-tab],[data-kind],[data-buy]'); if (!t) return;
    const c = Closet.get();
    if (t.dataset.buy) {
      if (!clSel) return;
      const { kind, key } = clSel, it = itemOf(kind, key);
      if (acorns() < it[2]) return;
      acorns(-it[2]);
      if (!c.owned.includes(`${kind}:${key}`)) c.owned.push(`${kind}:${key}`);
      if (kind === 'hat') c.hat = key; else if (kind === 'color') c.color = key;
      else { const d = itemOf('deco', key); if (d[3] === 'back') c.back = key; else c[d[3]] = true; }
      Closet.set(c); Object.assign(ME, lookOf(c)); paintMe(); paintRecord(); Online.dress();
      clSel = null; clMsg = `${it[1]} 샀어요! 바로 입었어요.`;
      sfx('bet');
    }
    else if (t.dataset.tab) { clTab = t.dataset.tab; clSel = null; clMsg = ''; }
    else {
      const kind = t.dataset.kind, key = t.dataset.key;
      if (hasItem(c, kind, key)) {
        if (kind === 'hat') c.hat = key; else if (kind === 'color') c.color = key;
        else { const d = itemOf('deco', key); if (d[3] === 'back') c.back = c.back === key ? null : key; else c[d[3]] = !c[d[3]]; }
        Closet.set(c); Object.assign(ME, lookOf(c)); paintMe(); Online.dress(); clSel = null; clMsg = `${itemOf(kind, key)[1]} ${wearing(c, kind, key) ? '입었어요!' : '벗었어요'}`;
        sfx('hop');
      } else { clSel = { kind, key }; clMsg = ''; sfx('place'); }
    }
    const top = closetBody.scrollTop; renderCloset(); closetBody.scrollTop = top;
  });
  $('#closetBtn').addEventListener('click', e => { e.stopPropagation(); openCloset(); });
  $('#closetClose').addEventListener('click', () => closetDlg.close());
  closetDlg.addEventListener('close', () => { clSel = null; paintMe(); });
  setTimeout(() => { const w0 = Record.write; Record.write = r => { w0(r); paintClosetDot(); }; paintClosetDot(); });
  paintMe();
  /* 다른 창(루루피아)에서 도토리 · 옷이 바뀌면 윗줄 알약과 내 슬라임을 다시 그린다 */
  addEventListener('storage', e => {
    if (e.key === 'lulupia-acorn') paintRecord();
    if (e.key === 'slime-closet') { Object.assign(ME, lookOf(Closet.get())); if (!Online.watching) paintMe(); }
  });
  /* 처음 한 번 : 도토리가 조약돌로 바뀐 것을 알리고, 그동안 이긴 판 × 5 도토리(최대 300)를 선물.
     자동 시험 브라우저에서는 띄우지 않는다(window.__helloTest 면 띄움). 기록 · 그림이 다 준비된 뒤에 */
  setTimeout(() => {
    let seen = true, rec = null;
    try { seen = !!localStorage.getItem('neforest-hello'); rec = JSON.parse(localStorage.getItem('samsepan-record')); } catch {}
    if (seen || (navigator.webdriver && !window.__helloTest)) return;
    try { localStorage.setItem('neforest-hello', '1'); } catch {}
    if (!rec || !(rec.w + rec.l + rec.d > 0)) return;
    const gift = Math.min(300, (rec.w || 0) * 5);
    if (gift) acorns(gift);
    paintRecord();
    const el = $('#hello');
    el.innerHTML = `<b>${ACORN}네포레스트 소식</b><span>그동안 모은 도토리는 이제 <em>${PEBBLE}조약돌</em>이에요. 레벨은 그대로예요.</span><span>도토리는 숲 돈이 됐어요. 꾸미기에서 옷을 사고 루루피아와 같이 써요.${gift ? ` 이긴 판만큼 <em>도토리 ${gift}개</em>를 선물로 넣었어요.` : ''}</span><small>눌러서 닫기</small>`;
    el.hidden = false;
    const close = () => { el.classList.add('out'); setTimeout(() => { el.hidden = true; }, 300); };
    el.addEventListener('click', close, { once: true });
    setTimeout(close, 12000);
  });

  /* ---------- 숲 지도 : 갈 곳 카드 정보, 주민 게시판, 내 슬라임 말 ---------- */
  const won = n => n.toLocaleString('ko-KR');
  const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const readDex = () => readJSON('neforest-dex') || {};
  const metOf = (d, name) => { const r = d[name] || {}; return { dice: r.dice || { m: 0, w: 0 }, ox: r.ox || { m: 0, w: 0 }, m: ((r.dice || {}).m || 0) + ((r.ox || {}).m || 0) }; };
  function paintPlaces() {
    const r = Record.read(), games = r.w + r.l + r.d;
    set($('#diceInfo'), games ? `Lv.${levelOf(r.pts)} · ${won(r.w)}승${r.s > 1 ? ` · ${r.s}연승 중` : ''}` : '아직 안 해 봤어요');
    const ox = readJSON('lulupia-rec'), tw = readJSON('lulupia-tower');
    set($('#oxInfo'), ox && ox.games ? `탈출 ${won(ox.escapes || 0)}번 · 최고 ${Math.max(0, ox.best)}단` : tw && tw.games ? `끝없는 탑 최고 ${tw.best}층` : '아직 안 해 봤어요');
    const c = Closet.get(), have = k => SHOP[k].filter(([key]) => hasItem(c, k, key)).length;
    set($('#closetInfo'), `모자 ${have('hat')}/${SHOP.hat.length} · 색 ${have('color')}/${SHOP.color.length}`);
    const d = readDex(), met = RIVALS.filter(x => metOf(d, x.name).m > 0).length;
    set($('#dexInfo'), `만난 주민 ${met}/${RIVALS.length}`);
    set($('#meInfo'), games ? `Lv.${levelOf(r.pts)}` : '');
  }
  /* 주민 게시판 : 별마다 다섯 명. 티티카카에서 만난 판 · 이긴 판(혼자 할 때 기록) */
  const STAR = '<svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M10 1.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L10 14.8l-5.2 2.8 1-5.8L1.5 7.7l5.9-.8z" fill="#FFC531" stroke="#C7880A" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  function openDex() {
    const d = readDex();
    let seq = 0;
    const met = RIVALS.filter(x => metOf(d, x.name).m > 0).length;
    const groups = [1, 2, 3, 4, 5].map(st => `<section class="dex-star"><h3>${STAR.repeat(st)}</h3><div class="dex-list">${RIVALS.filter(x => x.stars === st).map(x => {
      const m = metOf(d, x.name);
      return `<div class="dex-card${m.m ? '' : ' new'}"><svg class="pt npc" data-face="idle" viewBox="0 0 100 100" aria-hidden="true">${rivalArt({ ...x, id: 'dx' + (++seq) })}</svg><div><b>${x.name}</b><i>${x.hi}</i><em>${m.m ? `티티카카 ${m.dice.m}판 ${m.dice.w}승` : '아직 못 만났어요'}</em></div></div>`;
    }).join('')}</div></section>`).join('');
    $('#dexBody').innerHTML = `<p class="dex-sum">숲에 사는 슬라임 ${RIVALS.length}명 중 ${met}명을 만났어요. 티티카카 혼자 하기에서 만나면 여기에 적혀요.</p>${groups}`;
    $('#dex').showModal();
  }
  $('#dexBtn').addEventListener('click', openDex);
  $('#dexClose').addEventListener('click', () => $('#dex').close());
  $('#closetPlace').addEventListener('click', () => openCloset());
  $('#closet').addEventListener('close', () => paintPlaces());
  /* 내 슬라임을 누르면 웃으며 한마디 */
  const LINES = ['오늘은 어디로 갈까?', '도토리 모으러 가자!', '주사위 한 판 어때?', '덩굴 탑 꼭대기까지!', '새 모자 갖고 싶다…', '숲 친구들이 기다려!', '조약돌도 반짝반짝!'];
  $('#meArt').addEventListener('click', () => {
    const m = $('#meArt'), say = $('#say');
    m.dataset.face = 'laugh';
    clearTimeout(m._t); m._t = setTimeout(() => { m.dataset.face = 'idle'; }, 1300);
    let t; do t = LINES[Math.floor(Math.random() * LINES.length)]; while (t === say.textContent);
    say.textContent = t;
    say.style.animation = 'none'; void say.offsetWidth; say.style.animation = '';
  });
  /* 다른 창(게임)에서 돌아오거나 값이 바뀌면 다시 그린다 */
  const refresh = () => { Object.assign(ME, lookOf(Closet.get())); paintMe(); paintRecord(); };
  addEventListener('storage', refresh);
  addEventListener('pageshow', e => { if (e.persisted) refresh(); });
  paintRecord();

})();
</script>
</body>
</html>
